                    {allDone ? "Log a checkpoint to record this count." : t.flagged ? "Red cases haven't been scanned yet." : "QR codes work with or without a bag tag, so scan away from the airport too."}
                  </div>
                </div>
              </div>
              {t.caseCodes.some((c) => tagOf(cases[c])?.number) ? (
                <div className="flex gap-2 mt-3">
                  <button className="btn flex-1" style={{ minHeight: 54, fontSize: 15 }} onClick={() => setSheet({ kind: "scan" })}>
                    <QrCode size={20} /> QR sticker
                  </button>
                  <button className="btn btn-primary flex-1" style={{ minHeight: 54, fontSize: 15 }} onClick={() => setSheet({ kind: "scanTag" })}>
                    <ScanLine size={20} /> Bag tag
                  </button>
                </div>
              ) : (
                <button className="btn btn-primary w-full mt-3" style={{ minHeight: 54, fontSize: 16 }} onClick={() => setSheet({ kind: "scanTag" })}>
                  <ScanLine size={22} /> Scan a bag tag
                </button>
              )}
              <div className="flex flex-col gap-3 mt-4">
                {t.caseCodes.map((c) => (
                  <CaseRow key={c} c={cases[c]} status={statusOf(t, c)} onClick={() => setSheet({ kind: "detail", code: c })}
                    sub={tagOf(cases[c])?.number ? `Tag: ${fmtTag(tagOf(cases[c]).number)}` : null}
                    right={<button className="iconbtn" style={{ width: 36, height: 36 }} aria-label={`Update bag tag for ${cases[c].name}`} onClick={(e) => { e.stopPropagation(); setSheet({ kind: "changeTag", code: c }); }}><ScanLine size={16} /></button>} />
                ))}
              </div>
              {cpList}
            </>
          )}

          {/* ---------- Past ---------- */}
          {isPast && (
            <>
              <div className="disp" style={{ fontSize: 18, fontWeight: 600, margin: "4px 0 10px" }}>Luggage ({total})</div>
              <div className="flex flex-col gap-3">
                {t.caseCodes.map((c) => <CaseRow key={c} c={cases[c]} onClick={() => setSheet({ kind: "detail", code: c })} />)}
              </div>
              {cpList}
              <button className="btn btn-primary w-full mt-7" onClick={() => duplicateTrip(t)}><Copy size={18} /> Use as a new trip</button>
            </>
          )}
        </div>

        {/* ---------- Floating action bar ---------- */}
        {!isPast && (
          <div className="fixed bottom-0 left-0 right-0 z-30 pointer-events-none">
            <div className="mx-auto max-w-md px-4 pb-4">
              <div className="glass pointer-events-auto" style={{ borderRadius: 999, padding: 6 }}>
                {t.mode === "edit" ? (
                  <button className="btn btn-primary w-full" disabled={total === 0} onClick={() => updateTrip(t.id, (x) => ({ ...x, mode: "check" }))}>
                    <Play size={18} /> Start trip
                  </button>
                ) : (
                  <div className="flex gap-2">
                    <button className="btn flex-1" onClick={openCheckpoint}><Flag size={18} /> Log checkpoint</button>
                    <button className="btn btn-primary flex-1" onClick={openComplete}><Check size={18} /> Complete trip</button>
                  </div>
                )}
              </div>
            </div>
          </div>
        )}
      </div>
    );
  };

  if (!loaded) {
    return (
      <div className="cm w-full">
        <style>{CSS}</style>
        <div className="backdrop" />
        <div className="mx-auto max-w-md min-h-screen flex items-center justify-center relative" style={{ zIndex: 1 }}>
          <div className="mut" style={{ fontSize: 14 }}>Loading your kit...</div>
        </div>
      </div>
    );
  }

  const SAVE_LABEL = { saving: "Saving...", saved: "Saved", error: "Couldn't save, will retry" };
  const SAVE_COLOR = { saving: "rgba(226,232,255,.55)", saved: "#7CF0B8", error: "#FF9AA3" };

  return (
    <div className="cm w-full">
      <style>{CSS}</style>
      <div className="backdrop" />
      <div className="mx-auto max-w-md min-h-screen flex flex-col relative" style={{ zIndex: 1 }}>
        {trip ? (
          TripScreen()
        ) : (
          <>
            <div className="px-5 pt-6 pb-2">
              <div className="flex items-center gap-3">
                <span aria-hidden="true" style={{ width: 30, height: 30, display: "grid", gridTemplateColumns: "1fr 1fr", borderRadius: 9, overflow: "hidden", border: "1px solid rgba(255,255,255,.4)", boxShadow: "0 0 18px rgba(143,245,255,.35)" }}>
                  {[1, 0, 0, 1].map((f, i) => <i key={i} style={{ background: f ? "rgba(255,255,255,.92)" : "rgba(255,255,255,.08)" }} />)}
                </span>
                <span className="disp" style={{ fontSize: 30, fontWeight: 700 }}>Checkmate</span>
                {saveState_ !== "idle" && (
                  <span className="mut flex items-center gap-1" style={{ fontSize: 11.5, marginLeft: "auto", color: SAVE_COLOR[saveState_] }}>
                    <span aria-hidden="true" style={{ width: 6, height: 6, borderRadius: "50%", background: "currentColor" }} />{SAVE_LABEL[saveState_]}
                  </span>
                )}
              </div>
              <div className="mut" style={{ fontSize: 13.5, marginTop: 8 }}>
                {tab === "trips" ? "Scan it out. Scan it in." : `${mineCodes.length} cases in My Kit, ${freeCodes.length} stickers unused`}
              </div>
            </div>
            <main className="flex-1" style={{ paddingBottom: 110 }}>{tab === "trips" ? TripsList() : (
              <KitTab cases={cases} trips={trips} folders={folders} setFolders={setFolders} openF={openF} setOpenF={setOpenF} say={say}
                hasCurrentTrip={trips.some((t) => t.status === "current")}
                onOpen={(code) => setSheet({ kind: "detail", code })}
                onAddCase={() => setSheet({ kind: "destination" })}
                onNewFolder={() => { setFolderName(""); setSheet({ kind: "newFolder" }); }}
                onFolderMenu={(id) => { setFolderName(folders.find((f) => f.id === id)?.name || ""); setSheet({ kind: "folderMenu", id }); }}
                onAddToTrip={(codes) => setSheet({ kind: "assignTrip", codes })}
                onNewTrip={(codes) => { setNewName(""); setSheet({ kind: "newTripFrom", codes }); }} />
            )}</main>
            <nav className="fixed bottom-0 left-0 right-0 z-30 pointer-events-none" aria-label="Main">
              <div className="mx-auto max-w-md px-4 pb-4">
                <div className="glass flex pointer-events-auto" style={{ borderRadius: 999, padding: 5 }}>
                  <button className="tab" aria-current={tab === "trips" ? "page" : undefined} onClick={() => setTab("trips")}><ClipboardList size={21} /> Trips</button>
                  <button className="tab" aria-current={tab === "kit" ? "page" : undefined} onClick={() => setTab("kit")}><Boxes size={21} /> Kit</button>
                </div>
              </div>
            </nav>
          </>
        )}
        {renderSheet()}
        {toast && (
          <div role="status" className="fixed left-0 right-0 flex justify-center px-4" style={{ bottom: 100, zIndex: 60 }}>
            <div className="glass" style={{ padding: "11px 18px", borderRadius: 999, fontSize: 14, fontWeight: 600, maxWidth: 380, background: "rgba(24,30,56,.85)" }}>{toast}</div>
          </div>
        )}
      </div>
    </div>
  );
}

/* ------------------------------------------------------------------ */
/*  Sheets that hold local state                                       */
/* ------------------------------------------------------------------ */
const rowCheck = (on) => (
  <span aria-hidden="true" style={{ width: 28, height: 28, borderRadius: "50%", border: "1px solid rgba(255,255,255,.4)", background: on ? "linear-gradient(180deg,#fff,#D4E2FF)" : "rgba(255,255,255,.06)", color: "#0A0F1E", display: "flex", alignItems: "center", justifyContent: "center", flex: "none" }}>{on && <Check size={17} />}</span>
);

const matchCase = (c, ql) => !ql || [c.name, c.type, c.color, tagOf(c)?.number, c.code, c.contents].join("\n").toLowerCase().includes(ql);

function PickSheet({ trip, trips, cases, folders, onAdd, onClose }) {
  const [q, setQ] = useState("");
  const [sel, setSel] = useState([]);
  const [open, setOpen] = useState({ mine: true });
  const ql = q.trim().toLowerCase();
  const mineCodes = folders.find((f) => f.id === "mine")?.codes || [];
  const groups = [
    ...folders.map((f) => ({ id: f.id, title: f.name, codes: f.codes })),
    ...trips.filter((t) => t.status === "past").map((t) => ({ id: "trip:" + t.id, title: t.name, sub: "Previous trip", codes: t.caseCodes })),
  ];
  const listOf = (g) => g.codes.filter((c) => cases[c] && !trip.caseCodes.includes(c) && matchCase(cases[c], ql));
  const toggle = (c) => setSel((s) => (s.includes(c) ? s.filter((x) => x !== c) : [...s, c]));
  const shown = groups.filter((g) => !ql || listOf(g).length);

  return (
    <Sheet title="Choose from kit" onClose={onClose}>
      <div className="relative mt-5">
        <Search size={18} className="mut" style={{ position: "absolute", left: 15, top: 15 }} />
        <input className="field" style={{ paddingLeft: 42, borderRadius: 999 }} placeholder="Search all folders" aria-label="Search" value={q} onChange={(e) => setQ(e.target.value)} />
      </div>
      <div className="flex flex-col gap-3 mt-4">
        {shown.map((g) => {
          const list = listOf(g);
          return (
            <Folder key={g.id} title={g.title} sub={g.sub ? `${g.sub}, ${list.length} available` : `${list.length} available`} open={ql ? true : !!open[g.id]} onToggle={() => setOpen((o) => ({ ...o, [g.id]: !o[g.id] }))}>
              {list.map((c) => <CaseRow key={c} c={cases[c]} selected={sel.includes(c)} onClick={() => toggle(c)} right={rowCheck(sel.includes(c))} />)}
              {list.length === 0 && <div className="mut" style={{ padding: "8px 4px" }}>Everything here is already on this trip.</div>}
            </Folder>
          );
        })}
        {shown.length === 0 && <div className="mut" style={{ padding: "12px 0" }}>{ql ? `Nothing matches "${q}".` : "No kit to choose from yet."}</div>}
      </div>
      <button className="btn btn-primary w-full mt-4" disabled={sel.length === 0} onClick={() => onAdd(sel)}>
        <Plus size={20} /> Add {sel.length || ""} to trip
      </button>
    </Sheet>
  );
}

function ConfirmContentsSheet({ queue, tripId, onSaveContents, onDone, onClose }) {
  const [idx, setIdx] = useState(0);
  const [text, setText] = useState(queue[0]?.contents || "");
  const [added, setAdded] = useState([]);
  const cur = queue[idx];
  if (!cur) return null;

  const next = (code) => {
    const acc = code ? [...added, code] : added;
    if (idx + 1 >= queue.length) onDone(acc);
    else { setAdded(acc); setIdx(idx + 1); setText(queue[idx + 1]?.contents || ""); }
  };

  return (
    <Sheet title="Check what's inside" onClose={() => onDone(added)}>
      <p className="mut" style={{ fontSize: 13.5, marginTop: 6, lineHeight: 1.45 }}>
        Kit can get repacked between shoots. Quickly confirm this case still holds what's listed, or update it before it goes on the trip.
      </p>
      {queue.length > 1 && <div className="mut" style={{ fontSize: 13, fontWeight: 600, marginTop: 14 }}>Case {idx + 1} of {queue.length}</div>}
      <div className="glass flex items-center gap-3 mt-2" style={{ borderRadius: 22, padding: "10px 12px" }}>
        <Plate code={cur.code} status="idle" />
        <div style={{ minWidth: 0 }}>
          <div className="truncate" style={{ fontWeight: 700, fontSize: 16 }}>{cur.name}</div>
          <div className="mut flex items-center gap-2" style={{ fontSize: 13, marginTop: 2 }}><Swatch name={cur.color} /><span className="truncate">{cur.type}</span></div>
        </div>
      </div>
      <label className="lbl" htmlFor="ccc">Contents</label>
      <textarea id="ccc" className="field" rows={6} placeholder="One item per line" value={text} onChange={(e) => setText(e.target.value)} />
      <div className="flex gap-3 mt-5">
        <button className="btn flex-1" onClick={() => { onSaveContents(cur.code, text.trim()); next(cur.code); }}>
          <Check size={18} /> {text.trim() === (cur.contents || "").trim() ? "Confirm, unchanged" : "Save and add"}
        </button>
      </div>
      <button className="btn w-full mt-3" onClick={() => next()}>Skip, don't add this one</button>
    </Sheet>
  );
}

function ReuseSheet({ queue, tripId, freeCodes, onScan, onClose }) {
  const [idx, setIdx] = useState(0);
  const [status, setStatus] = useState({});
  const [scanning, setScanning] = useState(false);
  const scanned = useRef(false);
  const cur = queue[idx];
  const doneCount = Object.values(status).filter((v) => v === "done").length;

  const advance = (mark) => {
    setStatus((st) => ({ ...st, [cur.code]: mark }));
    if (idx + 1 >= queue.length) {
      const n = doneCount + (mark === "done" ? 1 : 0);
      onClose(`${n} of ${queue.length} rescanned and added`);
    } else setIdx(idx + 1);
  };

  const sims = cur ? [{ code: cur.code, text: "Same case as last time" }, ...freeCodes.slice(0, 2).map((c) => ({ code: c, text: "A different case, unused sticker" }))] : [];
  if (!cur) return null;
  return (
    <>
      <Sheet title="Rescan the QR code" onClose={() => onClose()}>
        <div className="glass flex gap-3 mt-5" style={{ borderRadius: 22, padding: 14 }}>
          <AlertTriangle size={20} color={AMBER} style={{ flex: "none", marginTop: 1 }} />
          <div style={{ fontSize: 14.5, lineHeight: 1.5 }}>
            Kit houses and kit rooms often hold several identical kits. This might not be the same physical case as last time, so scan the sticker on the case you're actually packing.
          </div>
        </div>
        <div className="mut" style={{ fontSize: 13, fontWeight: 600, marginTop: 16 }}>Case {idx + 1} of {queue.length}</div>
        <div className="glass flex items-center gap-3 mt-2" style={{ borderRadius: 22, padding: "10px 12px" }}>
          <Plate code={cur.code} status="idle" />
          <div style={{ minWidth: 0 }}>
            <div className="truncate" style={{ fontWeight: 700, fontSize: 16 }}>{cur.name}</div>
            <div className="mut flex items-center gap-2" style={{ fontSize: 13, marginTop: 2 }}><Swatch name={cur.color} /><span className="truncate">{cur.type}</span></div>
          </div>
        </div>
        <p className="mut" style={{ fontSize: 13, marginTop: 12, lineHeight: 1.45 }}>
          The name, contents and carnet details are copied across. The bag tag number and photos are left blank, because they belong to a specific case and journey.
        </p>
        <button className="btn btn-primary w-full mt-5" onClick={() => setScanning(true)}><ScanLine size={20} /> Scan QR sticker</button>
        <div className="flex gap-3 mt-3">
          {queue.length > 1 && <button className="btn flex-1" onClick={() => advance("skipped")}>Skip this one</button>}
          <button className="btn flex-1" onClick={() => onClose()}>{queue.length > 1 ? "Stop here" : "Cancel"}</button>
        </div>
      </Sheet>
      {scanning && (
        <Scanner title="Rescan QR code" hint={`Scan the sticker on ${cur.name}. If it's the same code as last time, it's confirmed as the same case.`}
          onScan={(c) => { const r = onScan(cur, c, tripId); if (r.kind === "ok") scanned.current = true; return r; }}
          onClose={() => { setScanning(false); if (scanned.current) { scanned.current = false; advance("done"); } }} sims={sims} closeOnOk progress={`Case ${idx + 1} of ${queue.length}`} />
      )}
    </>
  );
}

function KitTab({ cases, trips, folders, setFolders, openF, setOpenF, onOpen, onAddCase, onNewFolder, onFolderMenu, onAddToTrip, onNewTrip, hasCurrentTrip, say }) {
  const [q, setQ] = useState("");
  const [selectMode, setSelectMode] = useState(false);
  const [sel, setSel] = useState([]);
  const [drag, setDrag] = useState(null);
  const dragRef = useRef(null);
  const gest = useRef({});
  const suppress = useRef(false);
  const H = useRef({});
  const wrap = useRef({
    move: (e) => H.current.move(e),
    up: (e) => H.current.up(e),
    touch: (e) => { if (gest.current.active && e.cancelable) e.preventDefault(); },
  }).current;

  const ql = q.trim().toLowerCase();
  const byName = (x, y) => x.localeCompare(y);
  const editableGroups = folders.map((f) => ({ id: f.id, title: f.name, codes: f.codes, editable: true, system: f.id === "mine" }));
  const pastGroups = trips.filter((t) => t.status === "past").map((t) => ({ id: "trip:" + t.id, title: t.name, codes: t.caseCodes, editable: false }));
  const isOpen = (id) => openF[id] ?? id === "mine";
  const toggleOpen = (id) => setOpenF((o) => ({ ...o, [id]: !isOpen(id) }));
  const toggleSel = (c) => setSel((s) => (s.includes(c) ? s.filter((x) => x !== c) : [...s, c]));
  const count = (n) => `${n} ${n === 1 ? "case" : "cases"}`;

  /* ---------- press and hold to drag ---------- */
  const stopListening = () => {
    window.removeEventListener("pointermove", wrap.move);
    window.removeEventListener("pointerup", wrap.up);
    window.removeEventListener("pointercancel", wrap.up);
  };
  const cancelPress = () => { clearTimeout(gest.current.timer); stopListening(); };
  const endDrag = () => {
    const st = gest.current;
    st.active = false;
    cancelAnimationFrame(st.raf);
    clearTimeout(st.hover);
    st.hoverId = null;
    window.removeEventListener("touchmove", wrap.touch);
    cancelPress();
    dragRef.current = null;
    setDrag(null);
  };
  useEffect(() => () => { const st = gest.current; st.active = false; cancelAnimationFrame(st.raf); clearTimeout(st.hover); window.removeEventListener("touchmove", wrap.touch); cancelPress(); }, []);

  const startPress = (e, g, code) => {
    if (selectMode || ql) return;
    if (e.pointerType === "mouse" && e.button !== 0) return;
    if (e.isPrimary === false) return;
    const st = gest.current;
    cancelPress();
    const rect = e.currentTarget.getBoundingClientRect();
    Object.assign(st, { startX: e.clientX, startY: e.clientY, lastX: e.clientX, lastY: e.clientY, code, from: g.id, rect, active: false });
    window.addEventListener("pointermove", wrap.move);
    window.addEventListener("pointerup", wrap.up);
    window.addEventListener("pointercancel", wrap.up);
    st.timer = setTimeout(() => H.current.activate(), 380);
  };

  H.current.move = (e) => {
    const st = gest.current;
    st.lastX = e.clientX; st.lastY = e.clientY;
    if (!st.active) { if (Math.hypot(e.clientX - st.startX, e.clientY - st.startY) > 10) cancelPress(); return; }
    H.current.update(e.clientX, e.clientY);
  };

  H.current.activate = () => {
    const st = gest.current;
    st.active = true;
    try { if (navigator.vibrate) navigator.vibrate(12); } catch (err) { /* not supported */ }
    window.addEventListener("touchmove", wrap.touch, { passive: false });
    const d = { code: st.code, from: st.from, x: st.lastX, y: st.lastY, w: st.rect.width, h: st.rect.height, offX: st.startX - st.rect.left, offY: st.startY - st.rect.top, overFolder: null, overIndex: 0 };
    dragRef.current = d;
    setDrag(d);
    H.current.update(st.lastX, st.lastY);
    const loop = () => {
      if (!st.active) return;
      const dy = st.lastY < 90 ? -14 : st.lastY > window.innerHeight - 150 ? 14 : 0;
      if (dy) { try { window.scrollBy(0, dy); } catch (err) { /* ignore */ } H.current.update(st.lastX, st.lastY); }
      st.raf = requestAnimationFrame(loop);
    };
    st.raf = requestAnimationFrame(loop);
  };

  H.current.update = (x, y) => {
    const st = gest.current;
    let overFolder = null, overIndex = 0;
    const els = Array.from(document.querySelectorAll("[data-folder]"));
    const el = els.find((f) => { const r = f.getBoundingClientRect(); return y >= r.top && y <= r.bottom && x >= r.left - 24 && x <= r.right + 24; });
    if (el) {
      overFolder = el.dataset.folder;
      const ph = el.querySelector("[data-placeholder]");
      const shift = ph ? ph.getBoundingClientRect().height + 12 : 0;
      const rows = Array.from(el.querySelectorAll("[data-row]")).filter((r) => !(r.dataset.code === st.code && r.dataset.row === st.from && st.from === overFolder));
      overIndex = rows.filter((r) => {
        const rr = r.getBoundingClientRect();
        const after = ph && (ph.compareDocumentPosition(r) & 4);
        return y > rr.top + rr.height / 2 - (after ? shift : 0);
      }).length;
      // spring-loaded folders: hovering over a closed folder for a moment opens it
      if (el.dataset.open === "0" && st.hoverId !== overFolder) {
        clearTimeout(st.hover);
        st.hoverId = overFolder;
        const id = overFolder;
        st.hover = setTimeout(() => setOpenF((o) => ({ ...o, [id]: true })), 600);
      } else if (el.dataset.open === "1") { clearTimeout(st.hover); st.hoverId = null; }
    } else { clearTimeout(st.hover); st.hoverId = null; }
    const d = { ...dragRef.current, x, y, overFolder, overIndex };
    dragRef.current = d;
    setDrag(d);
  };

  H.current.up = (e) => {
    const st = gest.current;
    if (!st.active) { cancelPress(); return; }
    const d = dragRef.current;
    endDrag();
    suppress.current = true;
    setTimeout(() => { suppress.current = false; }, 300);
    if (e.type === "pointercancel" || !d || !d.overFolder) return;
    const target = folders.find((f) => f.id === d.overFolder);
    if (!target) { say("Past trip kit lists are a record of that shoot, so nothing can be dropped into them."); return; }
    const idx = isOpen(target.id) ? d.overIndex : target.codes.length;
    if (d.from === target.id) {
      setFolders((fs) => fs.map((f) => {
        if (f.id !== target.id) return f;
        const rest = f.codes.filter((c) => c !== d.code);
        rest.splice(Math.min(idx, rest.length), 0, d.code);
        return { ...f, codes: rest };
      }));
      return;
    }
    if (target.codes.includes(d.code)) { say(`${cases[d.code].name} is already in ${target.name}`); return; }
    setFolders((fs) => fs.map((f) => (f.id === target.id ? { ...f, codes: [...f.codes.slice(0, idx), d.code, ...f.codes.slice(idx)] } : f)));
    say(`${cases[d.code].name} added to ${target.name}. Same case, not a copy.`);
  };

  /* ---------- rendering ---------- */
  const rowFor = (g, c) => {
    const cs = cases[c];
    if (!cs) return null;
    const hit = ql ? lines(cs.contents).find((l) => l.toLowerCase().includes(ql)) : null;
    const dimmed = !!drag && drag.code === c && drag.from === g.id;
    return (
      <div key={c} data-row={g.id} data-code={c} className="kitrow" style={{ opacity: dimmed ? 0.35 : 1, transition: "opacity .12s" }}
        onPointerDown={(e) => startPress(e, g, c)} onContextMenu={(e) => e.preventDefault()}>
        <CaseRow c={cs} selected={selectMode && sel.includes(c)} sub={hit ? `Contains: ${hit}` : null} right={selectMode ? rowCheck(sel.includes(c)) : null}
          onClick={() => { if (suppress.current) return; if (selectMode) toggleSel(c); else onOpen(c); }} />
      </div>
    );
  };

  const renderFolder = (g) => {
    const over = !!drag && drag.overFolder === g.id;
    const droppable = g.editable && (!drag || drag.from === g.id || !g.codes.includes(drag.code));
    const hideDragged = !!drag && drag.from === g.id && g.editable && over;
    let codes = g.codes.filter((c) => cases[c]);
    if (hideDragged) codes = codes.filter((c) => c !== drag.code);
    const showPh = over && droppable;
    const ph = <div key="ph" data-placeholder="1" style={{ height: drag ? drag.h : 72, borderRadius: 22, border: "2px dashed rgba(190,215,255,.6)", background: "rgba(143,180,255,.10)" }} />;
    const items = [];
    codes.forEach((c, i) => { if (showPh && drag.overIndex === i) items.push(ph); items.push(rowFor(g, c)); });
    if (showPh && drag.overIndex >= codes.length) items.push(ph);
    const allSelected = codes.length > 0 && codes.every((c) => sel.includes(c));
    let sub = count(g.codes.length);
    if (over && !droppable) sub = g.editable ? "Already in this folder" : "Past trips can't be changed";
    else if (over) sub = "Drop to add";
    return (
      <Folder key={g.id} dataId={g.id} editable={g.editable} title={g.title} sub={sub} open={isOpen(g.id)} hl={over ? (droppable ? "ok" : "no") : null}
        onToggle={() => toggleOpen(g.id)} onMenu={g.editable ? () => onFolderMenu(g.id) : null}>
        {selectMode && codes.length > 0 && (
          <button className="chip" style={{ alignSelf: "flex-start" }} onClick={() => setSel((s) => (allSelected ? s.filter((c) => !codes.includes(c)) : [...new Set([...s, ...codes])]))}>
            {allSelected ? "Deselect all" : "Select all"}
          </button>
        )}
        {items}
        {items.length === 0 && <div className="mut" style={{ padding: "8px 4px", fontSize: 14 }}>{g.editable ? "Nothing here yet. Press and hold a case, then drag it in." : "No cases were recorded on this trip."}</div>}
      </Folder>
    );
  };

  let body;
  if (ql) {
    const groups = [...editableGroups, ...pastGroups]
      .map((g) => ({ ...g, list: g.codes.filter((c) => cases[c] && matchCase(cases[c], ql)) }))
      .filter((g) => g.list.length);
    body = groups.length ? groups.map((g) => (
      <div key={g.id}>
        <div className="disp" style={{ fontSize: 17, fontWeight: 600 }}>{g.title}</div>
        <div className="mut" style={{ fontSize: 13, marginTop: 2 }}>{g.editable ? "Folder" : "Previous trip"}</div>
        <div className="flex flex-col gap-3 mt-3">{g.list.map((c) => rowFor(g, c))}</div>
      </div>
    )) : <div className="mut" style={{ padding: "32px 8px", textAlign: "center" }}>Nothing matches "{q}" in your folders or previous trips.</div>;
  } else {
    body = (
      <>
        <div className="flex flex-col gap-3">{editableGroups.map(renderFolder)}</div>
        <div>
          <div className="disp" style={{ fontSize: 18, fontWeight: 600, margin: "8px 0 10px" }}>Previous trips</div>
          <div className="flex flex-col gap-3">
            {pastGroups.map(renderFolder)}
            {pastGroups.length === 0 && <div className="mut" style={{ padding: "8px 4px" }}>When a trip ends, its kit list appears here as a folder.</div>}
          </div>
        </div>
      </>
    );
  }

  const act = (fn) => { const codes = [...sel]; setSel([]); setSelectMode(false); fn(codes); };

  return (
    <div className="px-4 pt-3">
      <div className="relative">
        <Search size={18} className="mut" style={{ position: "absolute", left: 15, top: 15 }} />
        <input className="field" style={{ paddingLeft: 42, borderRadius: 999 }} placeholder="Search all folders and trips" aria-label="Search kit" value={q} onChange={(e) => setQ(e.target.value)} />
      </div>
      <button className="btn btn-primary w-full mt-3" onClick={onAddCase}><Plus size={20} /> Add case to kit</button>
      <div className="flex gap-3 mt-3">
        <button className="btn flex-1" onClick={onNewFolder}><FolderPlus size={18} /> New folder</button>
        <button className="btn flex-1" aria-pressed={selectMode} style={selectMode ? { background: "rgba(255,255,255,.92)", color: "#0A0F1E" } : null}
          onClick={() => { setSelectMode((m) => !m); setSel([]); }}><Check size={18} /> {selectMode ? "Cancel select" : "Select"}</button>
      </div>
      <div className="mut" style={{ fontSize: 12.5, marginTop: 10, lineHeight: 1.45 }}>
        {selectMode ? "Tap cases to select them, then add them to a trip." : "Press and hold a case, then drag it into a folder. Folders link to a case, they never copy it."}
      </div>
      <div className="flex flex-col gap-4 mt-4">{body}</div>
      <div style={{ height: selectMode && sel.length ? 130 : 0 }} />

      {selectMode && sel.length > 0 && (
        <div className="fixed left-0 right-0 z-30" style={{ bottom: 92 }}>
          <div className="mx-auto max-w-md px-4">
            <div className="glass" style={{ borderRadius: 26, padding: 12 }}>
              <div className="flex items-center justify-between px-1 pb-2">
                <b style={{ fontSize: 15 }}>{sel.length} selected</b>
                <button className="mut" style={{ background: "transparent", border: "none", fontSize: 14, fontWeight: 600, padding: 6 }} onClick={() => setSel([])}>Clear</button>
              </div>
              <div className="flex gap-2">
                <button className="btn flex-1" disabled={!hasCurrentTrip} onClick={() => act(onAddToTrip)}>Add to trip</button>
                <button className="btn btn-primary flex-1" onClick={() => act(onNewTrip)}>Create new trip</button>
              </div>
            </div>
          </div>
        </div>
      )}

      {drag && cases[drag.code] && (
        <div aria-hidden="true" style={{ position: "fixed", left: drag.x - drag.offX, top: drag.y - drag.offY, width: drag.w, zIndex: 80, pointerEvents: "none", transform: "scale(1.03) rotate(-1deg)", filter: "drop-shadow(0 18px 28px rgba(0,0,0,.55))" }}>
          <CaseRow c={cases[drag.code]} />
        </div>
      )}
    </div>
  );
}

function CheckpointSheet({ trip, cases, mode, onConfirm, onClose }) {
  const [name, setName] = useState("");
  const missing = trip.caseCodes.filter((c) => !trip.scanned.includes(c));
  const complete = mode === "complete";
  const ok = missing.length === 0;
  const suggestions = ["Leaving the office", "Arrived at the airport", "Checked in", "Off the belt", "Through customs", "Back at base"];
  return (
    <Sheet title={complete ? "Complete trip" : "Log a checkpoint"} onClose={onClose}>
      {!complete && (
        <p className="mut" style={{ fontSize: 13.5, marginTop: 6, lineHeight: 1.45 }}>
          A checkpoint is a full count of your kit at any stage of the journey, tag or no tag: leaving the office, at the airport, off the belt, wherever you want to be sure everything's still with you.
        </p>
      )}
      <div className={`glass mt-4 ${ok ? "glass-ok" : "glass-bad"}`} style={{ borderRadius: 22, padding: 14 }}>
        <div style={{ fontWeight: 700, color: ok ? "#8CF3C0" : "#FFB3BA" }}>
          {ok ? `All ${trip.caseCodes.length} cases scanned` : `${missing.length} of ${trip.caseCodes.length} cases missing`}
        </div>
        {!ok && (
          <ul style={{ listStyle: "none", padding: 0, margin: "8px 0 0" }}>
            {missing.map((c) => (
              <li key={c} className="flex items-center gap-2" style={{ padding: "6px 0", fontSize: 14 }}>
                <AlertTriangle size={16} color={RED} style={{ flex: "none" }} />
                <span className="disp" style={{ fontSize: 14, fontWeight: 600 }}>{c}</span>
                <span className="truncate">{cases[c].name}{tagOf(cases[c])?.number ? `, tag ${fmtTag(tagOf(cases[c]).number)}` : ""}</span>
              </li>
            ))}
          </ul>
        )}
      </div>
      <label className="lbl" htmlFor="legn">Where are you?</label>
      <input id="legn" className="field" placeholder={`Checkpoint ${trip.checkpoints.length + 1}, e.g. Off the belt`} value={name} onChange={(e) => setName(e.target.value)} />
      {!complete && (
        <div className="flex gap-2 flex-wrap mt-3">
          {suggestions.map((s) => <button key={s} className="chip" onClick={() => setName(s)}>{s}</button>)}
        </div>
      )}
      <p className="mut" style={{ fontSize: 13, marginTop: 12, lineHeight: 1.45 }}>
        {complete ? "This logs a final checkpoint and moves the trip to Past trips." : "This logs the scan result with a timestamp, then clears the list ready for the next checkpoint."}
      </p>
      <button className={`btn w-full mt-5 ${ok ? "btn-primary" : "btn-danger"}`} onClick={() => onConfirm(mode, name)}>
        <Check size={18} /> {ok ? (complete ? "Complete trip" : "Log checkpoint") : `${complete ? "Complete" : "Log"} with ${missing.length} missing`}
      </button>
      <button className="btn w-full mt-3" onClick={onClose}>Keep scanning</button>
    </Sheet>
  );
}


const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(React.createElement(Checkmate));
</script>
