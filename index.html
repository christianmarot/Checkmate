const parseCode = (raw) => {
  const s = String(raw).trim();
  const m = s.match(/CM[-\s]?(\d{1,4})/i) || s.match(/^(\d{1,4})$/);
  if (!m) return null;
  const n = parseInt(m[1], 10);

};

const readAsDataURL = (f) =>
  new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onload = () => resolve(r.result);
    r.onerror = () => reject(new Error("file read failed"));
    r.readAsDataURL(f);
  });

const loadImage = (src) =>
  new Promise((resolve, reject) => {
    const i = new Image();
    i.onload = () => resolve(i);
    i.onerror = () => reject(new Error("image decode failed"));
    i.src = src;
  });

// Shrinks a photo to a sensible size. Uses a data URL (not a blob URL) because blob URLs can be blocked in embedded views.
async function fileToJpeg(file, max = 1600, quality = 0.88) {
  const raw = await readAsDataURL(file);
  try {
    const img = await loadImage(raw);
    const s = Math.min(1, max / Math.max(img.width, img.height));
    const c = document.createElement("canvas");
    c.width = Math.round(img.width * s);
    c.height = Math.round(img.height * s);
    c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
    return c.toDataURL("image/jpeg", quality);
  } catch (err) {
    if (/^data:image\/(jpeg|png|webp|gif);/.test(raw) && raw.length < 5000000) return raw;
    throw err;
  }
}

/* ITF-BEGIN */
// Interleaved 2 of 5 decoder, the barcode type used on airline bag tags (10-digit licence plate).
// Works on a grayscale pixel array, scanning lines at many angles so the tag can be held at any orientation.
const ITF_PAT = ["00110", "10001", "01001", "11000", "00101", "10100", "01100", "00011", "10010", "01010"]; // 1 = wide element

function itfDigit(g) {
  const idx = [0, 1, 2, 3, 4].sort((a, b) => g[b] - g[a]);
  if (g[idx[1]] < g[idx[2]] * 1.25) return -1; // the two wide elements must clearly beat the narrow ones
  const wide = [idx[0], idx[1]];
  return ITF_PAT.indexOf([0, 1, 2, 3, 4].map((i) => (wide.includes(i) ? "1" : "0")).join(""));
}

function decodeRuns(runs, firstIsBar) {
  const n = runs.length;
  for (let i = 1; i + 57 <= n; i++) {
    const isBar = firstIsBar ? i % 2 === 0 : i % 2 === 1;
    if (!isBar) continue;
    const u = (runs[i] + runs[i + 1] + runs[i + 2] + runs[i + 3]) / 4;
    if (u < 1.5) continue;
    if (runs[i - 1] < u * 3) continue; // quiet zone before the start pattern
    let ok = true;
    for (let k = 0; k < 4; k++) if (runs[i + k] < u * 0.5 || runs[i + k] > u * 1.8) { ok = false; break; }
    if (!ok) continue;
    let digits = "";
    let p = i + 4;
    for (let k = 0; k < 5 && ok; k++) {
      const bars = [], spaces = [];
      for (let j = 0; j < 5; j++) { bars.push(runs[p + 2 * j]); spaces.push(runs[p + 2 * j + 1]); }
      const a = itfDigit(bars), b = itfDigit(spaces);
      if (a < 0 || b < 0) ok = false;
      else { digits += a + "" + b; p += 10; }
    }
    if (!ok) continue;
    const t0 = runs[p], t1 = runs[p + 1], t2 = runs[p + 2];
    if (!(t0 > t1 * 1.3 && t0 > t2 * 1.3)) continue; // stop pattern: wide bar, narrow space, narrow bar
    if (t1 > u * 1.9 || t2 > u * 1.9) continue;
    const q = runs[p + 3];
    if (q !== undefined && q < u * 2.5) continue; // quiet zone after the stop pattern
    return digits;
  }
  return null;
}

function otsu(a) {
  const hist = new Uint32Array(256);
  for (let i = 0; i < a.length; i++) hist[Math.max(0, Math.min(255, a[i] | 0))]++;
  let sum = 0;
  for (let t = 0; t < 256; t++) sum += t * hist[t];
  let sB = 0, wB = 0, max = -1, thr = 128;
  for (let t = 0; t < 256; t++) {
    wB += hist[t];
    if (!wB) continue;
    const wF = a.length - wB;
    if (!wF) break;
    sB += t * hist[t];
    const mB = sB / wB, mF = (sum - sB) / wF;
    const between = wB * wF * (mB - mF) * (mB - mF);
    if (between > max) { max = between; thr = t; }
  }
  return thr;
}

function adaptiveThr(a) {
  const n = a.length, W = Math.max(25, Math.round(n / 10));
  const pre = new Float64Array(n + 1);
  for (let i = 0; i < n; i++) pre[i + 1] = pre[i] + a[i];
  const out = new Float32Array(n);
  for (let i = 0; i < n; i++) {
    const lo = Math.max(0, i - W), hi = Math.min(n, i + W + 1);
    out[i] = ((pre[hi] - pre[lo]) / (hi - lo)) * 0.92;
  }
  return out;
}

function runsOf(a, thr, arr) {
  // Run lengths with sub-pixel edge positions (linear interpolation at the threshold crossing).
  const T = (i) => (arr ? arr[i] : thr);
  const runs = [];
  let prev = 0;
  let cur = a[0] < T(0);
  const firstIsBar = cur;
  for (let i = 1; i < a.length; i++) {
    const d = a[i] < T(i);
    if (d !== cur) {
      const den = a[i] - a[i - 1] - (T(i) - T(i - 1));
      let f = den !== 0 ? (T(i - 1) - a[i - 1]) / den : 0.5;
      f = f < 0 ? 0 : f > 1 ? 1 : f;
      const pos = i - 1 + f;
      runs.push(pos - prev);
      prev = pos;
      cur = d;
    }
  }
  runs.push(a.length - prev);
  return { runs, firstIsBar };
}

function tryRuns(a, thr, arr) {
  const { runs, firstIsBar } = runsOf(a, thr, arr);
  if (runs.length < 58) return null;
  const v = decodeRuns(runs, firstIsBar);
  if (v) return v;
  const lastIsBar = firstIsBar ? (runs.length - 1) % 2 === 0 : (runs.length - 1) % 2 === 1;
  return decodeRuns(runs.slice().reverse(), lastIsBar);
}

function decodeLine(line) {
  const n = line.length;
  if (n < 120) return null;
  let lo = 255, hi = 0;
  for (let i = 0; i < n; i++) { if (line[i] < lo) lo = line[i]; if (line[i] > hi) hi = line[i]; }
  if (hi - lo < 40) return null;
  const sm = new Float32Array(n);
  sm[0] = line[0]; sm[n - 1] = line[n - 1];
  for (let i = 1; i < n - 1; i++) sm[i] = (line[i - 1] + 2 * line[i] + line[i + 1]) / 4;
  return tryRuns(sm, otsu(sm), null) || tryRuns(sm, 0, adaptiveThr(sm)) || tryRuns(line, otsu(line), null) || tryRuns(line, 0, adaptiveThr(line));
}

function sampleLine(g, w, h, x0, y0, dx, dy, len) {
  const out = new Float32Array(len);
  let x = x0, y = y0;
  for (let i = 0; i < len; i++) {
    const xi = Math.round(x), yi = Math.round(y);
    out[i] = xi >= 0 && xi < w && yi >= 0 && yi < h ? g[yi * w + xi] : 255;
    x += dx; y += dy;
  }
  return out;
}

function downsample(g, w, h, f) {
  const nw = Math.floor(w / f), nh = Math.floor(h / f), out = new Float32Array(nw * nh);
  for (let y = 0; y < nh; y++)
    for (let x = 0; x < nw; x++) {
      let s = 0;
      for (let j = 0; j < f; j++) for (let i = 0; i < f; i++) s += g[(y * f + j) * w + x * f + i];
      out[y * nw + x] = s / (f * f);
    }
  return { data: out, w: nw, h: nh };
}

// Returns { value, votes } once at least 3 scanlines agree on the same 10 digits, otherwise null.
async function decodeITF(gray, w, h, opts = {}) {
  const quick = !!opts.quick;
  const angles = quick ? [0, 90, 12, 78, 102, 168] : [0, 90, 10, 80, 100, 170, 20, 70, 110, 160, 30, 60, 120, 150, 40, 50, 130, 140];
  const scales = quick ? [1] : [1, 2];
  const votes = {};
  for (const f of scales) {
    let g = gray, gw = w, gh = h;
    if (f !== 1) { const d = downsample(gray, w, h, f); g = d.data; gw = d.w; gh = d.h; }
    const step = Math.max(3, Math.round(Math.min(gw, gh) / (quick ? 60 : 110)));
    for (const a of angles) {
      const rad = (a * Math.PI) / 180, dx = Math.cos(rad), dy = Math.sin(rad), nx = -dy, ny = dx;
      const along = Math.abs(dx) * gw + Math.abs(dy) * gh;
      const ext = (Math.abs(nx) * gw + Math.abs(ny) * gh) / 2;
      const len = Math.ceil(along);
      for (let s = -ext; s <= ext; s += step) {
        const line = sampleLine(g, gw, gh, gw / 2 + nx * s - (dx * along) / 2, gh / 2 + ny * s - (dy * along) / 2, dx, dy, len);
        const v = decodeLine(line);
        if (v) {
          votes[v] = (votes[v] || 0) + 1;
          if (votes[v] >= 3) return { value: v, votes: votes[v] };
        }
      }
      if (!quick) await new Promise((r) => setTimeout(r, 0));
    }
  }
  return null; // fewer than 3 scanlines agreed: better to say nothing than to guess
}
/* ITF-END */

async function nativeItf() {
  try {
    if (!("BarcodeDetector" in window)) return null;
    const f = await window.BarcodeDetector.getSupportedFormats();
    return f.includes("itf") ? new window.BarcodeDetector({ formats: ["itf"] }) : null;
  } catch (e) { return null; }
}

function grayFromCanvas(canvas) {
  const { data, width, height } = canvas.getContext("2d", { willReadFrequently: true }).getImageData(0, 0, canvas.width, canvas.height);
  const g = new Float32Array(width * height);
  for (let i = 0, j = 0; i < g.length; i++, j += 4) g[i] = (data[j] * 299 + data[j + 1] * 587 + data[j + 2] * 114) / 1000;
  return { data: g, w: width, h: height };
}

// Reads the bag tag barcode from a still photo: the browser's own reader first, then the app's decoder.
async function decodeBarcodePhoto(dataUrl) {
  const img = await loadImage(dataUrl);
  const native = await nativeItf();
  if (native) {
    try {
      const out = await native.detect(img);
      const hit = out.find((b) => /^\d{10}$/.test(String(b.rawValue).trim()));
      if (hit) return { value: String(hit.rawValue).trim() };
    } catch (e) { /* fall through to the app decoder */ }
  }
  const c = document.createElement("canvas");
  c.width = img.width;
  c.height = img.height;
  c.getContext("2d").drawImage(img, 0, 0);
  const g = grayFromCanvas(c);
  const r = await decodeITF(g.data, g.w, g.h);
  return r ? { value: r.value } : null;
}

// Fallback: read the largest line of digits from a photo of the label.
// This calls Claude's API to read the photo, so it only works where that API is reachable
// (inside Claude's own preview). In this standalone build it will fail and hand off to manual
// entry below, which always works regardless of network access.
async function readNumber(dataUrl) {
  const [head, data] = dataUrl.split(",");
  const media = (head.match(/data:(.*?);/) || [])[1] || "image/jpeg";
  const res = await fetch("https://api.anthropic.com/v1/messages", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      model: "claude-sonnet-4-6",
      max_tokens: 100,
      messages: [{
        role: "user",
        content: [
          { type: "image", source: { type: "base64", media_type: media, data } },
          {
            type: "text",
            text: "This is a photo of an airline luggage tag. Find the largest, boldest line of NUMBERS on the tag. That is the bag's unique code and it contains digits only. Ignore anything that mixes letters and numbers (booking references, flight numbers), dates, times, airport codes, airline names and surnames. Reply with only the digits of that line, with no spaces and no other text. If you cannot read it confidently, reply NONE.",
          },
        ],
      }],
    }),
  });
  const raw = await res.text();
  if (!res.ok) throw new Error(`service ${res.status}: ${raw.slice(0, 80)}`);
  let j;
  try { j = JSON.parse(raw); } catch (e) { throw new Error(`unexpected reply: ${raw.slice(0, 80)}`); }
  const text = (j.content || []).map((b) => (b.type === "text" ? b.text : "")).join("").trim();
  if (!text) throw new Error("empty reply");
  if (/NONE/i.test(text)) return "";
  const m = text.replace(/(\d)[\s-]+(?=\d)/g, "$1").match(/\d{6,}/);
  return m ? m[0] : "";
}

function Scanner({ title, hint, onScan, onClose, sims = [], closeOnOk = false, progress }) {
  const videoRef = useRef(null);
  const [cam, setCam] = useState(false);
  const [fb, setFb] = useState(null);
  const [manual, setManual] = useState("");
  const timer = useRef();
  const onScanRef = useRef(onScan);
  const onCloseRef = useRef(onClose);
  onScanRef.current = onScan;
  onCloseRef.current = onClose;

  const handle = (raw) => {
    const code = parseCode(raw);
    const res = code ? onScanRef.current(code) : { kind: "bad", text: "That isn't a Checkmate code" };
    setFb(res);
    clearTimeout(timer.current);
    if (res.kind === "ok" && closeOnOk) timer.current = setTimeout(() => onCloseRef.current(), 800);
    else timer.current = setTimeout(() => setFb(null), 1900);
  };
  const handleRef = useRef(handle);
  handleRef.current = handle;

  // Real camera scanning where the browser supports it; otherwise the demo buttons below are used.
  useEffect(() => {
    let stream, raf, stopped = false, last = { raw: "", t: 0 };
    (async () => {
      try {
        if (!navigator.mediaDevices?.getUserMedia || !("BarcodeDetector" in window)) return;
        const det = new window.BarcodeDetector({ formats: ["qr_code"] });
        stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
        if (stopped) { stream.getTracks().forEach((t) => t.stop()); return; }
        videoRef.current.srcObject = stream;
        await videoRef.current.play();
        setCam(true);
        const tick = async () => {
          if (stopped) return;
          try {
            const found = await det.detect(videoRef.current);
            const raw = found[0]?.rawValue;
            if (raw && (raw !== last.raw || Date.now() - last.t > 1800)) {
              last = { raw, t: Date.now() };
              handleRef.current(raw);
            }
          } catch (e) { /* keep trying */ }
          raf = requestAnimationFrame(tick);
        };
        tick();
      } catch (e) { /* no camera: demo mode */ }
    })();
    return () => {
      stopped = true;
      cancelAnimationFrame(raf);
      clearTimeout(timer.current);
      if (stream) stream.getTracks().forEach((t) => t.stop());
    };
  }, []);

  const fbBg = fb?.kind === "ok" ? "linear-gradient(180deg,#4BEBA5,#1FB878)" : fb?.kind === "warn" ? "linear-gradient(180deg,#FFD667,#F5B52E)" : "linear-gradient(180deg,#FF7A86,#E63E50)";
  const fbFg = fb?.kind === "ok" ? "#03150B" : fb?.kind === "warn" ? "#2A1D00" : "#fff";

  return (
    <div className="fixed inset-0 z-50 flex justify-center overflow-y-auto" style={{ background: "#070A14" }}>
      <div className="backdrop" style={{ opacity: 0.7 }} />
      <div className="w-full max-w-md flex flex-col pb-8 relative" style={{ color: "#fff", zIndex: 1 }}>
        <div className="flex items-center justify-between px-5 pt-5 pb-3">
          <div>
            <div className="disp" style={{ fontSize: 24, fontWeight: 700 }}>{title}</div>
            {progress && <div className="mut" style={{ fontSize: 13, marginTop: 2 }}>{progress}</div>}
          </div>
          <button className="btn" onClick={onClose}>Done</button>
        </div>

        <div className="relative mx-5 overflow-hidden" style={{ aspectRatio: "1 / 1", background: "rgba(0,0,0,.55)", borderRadius: 30, border: "1px solid rgba(255,255,255,.18)", boxShadow: "inset 0 1px 0 rgba(255,255,255,.3)" }}>
          <video ref={videoRef} muted playsInline className="absolute inset-0 w-full h-full" style={{ objectFit: "cover", display: cam ? "block" : "none" }} />
          {!cam && (
            <div className="absolute inset-0 flex flex-col items-center justify-center text-center px-10 gap-3 mut">
              <QrCode size={60} strokeWidth={1.5} />
              <p style={{ fontSize: 14, lineHeight: 1.45 }}>Camera isn't available in this preview. Tap a code below to simulate a scan.</p>
            </div>
          )}
          <span className="corner" style={{ top: 20, left: 20, borderRight: "none", borderBottom: "none" }} />
          <span className="corner" style={{ top: 20, right: 20, borderLeft: "none", borderBottom: "none" }} />
          <span className="corner" style={{ bottom: 20, left: 20, borderRight: "none", borderTop: "none" }} />
          <span className="corner" style={{ bottom: 20, right: 20, borderLeft: "none", borderTop: "none" }} />
          <span className="sweep" />
          {fb && (
            <div role="status" className="absolute left-4 right-4 bottom-4 px-4 py-3 font-bold" style={{ background: fbBg, color: fbFg, borderRadius: 18, fontSize: 15, boxShadow: "0 8px 24px rgba(0,0,0,.4), inset 0 1px 0 rgba(255,255,255,.5)" }}>
              {fb.text}
            </div>
          )}
        </div>

        {hint && <p className="px-5 mt-4 mut" style={{ fontSize: 14, lineHeight: 1.45 }}>{hint}</p>}

        {sims.length > 0 && (
          <div className="px-5 mt-4">
            <div className="mut" style={{ fontSize: 13, fontWeight: 600, marginBottom: 8 }}>Simulate a scan</div>
            <div className="flex flex-col gap-2">
              {sims.map((s) => (
                <button key={s.code} onClick={() => handle(s.code)} className="glass flex items-center gap-3 text-left" style={{ borderRadius: 18, padding: "10px 14px" }}>
                  <span className="disp" style={{ fontSize: 16, fontWeight: 600, minWidth: 74, color: "#8FF5FF" }}>{s.code}</span>
                  <span style={{ fontSize: 14 }} className="truncate">{s.text}</span>
                </button>
              ))}
            </div>
          </div>
        )}

        <div className="px-5 mt-5">
          <div className="flex items-center gap-2 mut" style={{ fontSize: 13, fontWeight: 600, marginBottom: 8 }}>
            <Keyboard size={15} /> Sticker damaged? Type the code
          </div>
          <div className="flex gap-2">
            <input className="field" placeholder="e.g. 0003" value={manual} onChange={(e) => setManual(e.target.value)}
              onKeyDown={(e) => { if (e.key === "Enter" && manual) { handle(manual); setManual(""); } }} />
            <button className="btn btn-primary" onClick={() => { if (manual) { handle(manual); setManual(""); } }}>Enter</button>
          </div>
        </div>
      </div>
    </div>
  );
}

/*  Checklist scanning by bag tag (for use before QR stickers exist)   */

function TagScanner({ title, hint, progress, onScan, onClose, sims = [] }) {
  const videoRef = useRef(null);
  const [cam, setCam] = useState(false);
  const [fb, setFb] = useState(null);
  const [manual, setManual] = useState("");
  const [busy, setBusy] = useState("");
  const fbTimer = useRef();
  const onScanRef = useRef(onScan);
  onScanRef.current = onScan;

  const handle = (raw) => {
    const digits = String(raw).replace(/\D/g, "");
    const res = digits.length >= 6 ? onScanRef.current(digits) : { kind: "bad", text: "That doesn't look like a bag tag number" };
    setFb(res);
    clearTimeout(fbTimer.current);
    fbTimer.current = setTimeout(() => setFb(null), 1900);
    return res;
  };
  const handleRef = useRef(handle);
  handleRef.current = handle;

  // Live scanning where the camera and barcode reading are available.
  useEffect(() => {
    let stream, timer, stopped = false, working = false, last = "", hits = 0;
    (async () => {
      try {
        if (!navigator.mediaDevices?.getUserMedia) return;
        stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment", width: { ideal: 1280 } } });
        if (stopped) { stream.getTracks().forEach((t) => t.stop()); return; }
        const v = videoRef.current;
        v.srcObject = stream;
        await v.play();
        setCam(true);
        const native = await nativeItf();
        const canvas = document.createElement("canvas");
        const tick = async () => {
          if (stopped) return;
          if (!working && v.videoWidth) {
            working = true;
            try {
              const sc = Math.min(1, 1000 / v.videoWidth);
              canvas.width = Math.round(v.videoWidth * sc);
              canvas.height = Math.round(v.videoHeight * sc);
              canvas.getContext("2d", { willReadFrequently: true }).drawImage(v, 0, 0, canvas.width, canvas.height);
              let val = null;
              if (native) {
                const out = await native.detect(canvas);
                const hit = out.find((b) => /^\d{10}$/.test(String(b.rawValue).trim()));
                if (hit) val = String(hit.rawValue).trim();
              }
              if (!val) {
                const g = grayFromCanvas(canvas);
                const r = await decodeITF(g.data, g.w, g.h, { quick: true });
                if (r) val = r.value;
              }
              if (val) {
                hits = val === last ? hits + 1 : 1;
                last = val;
                if (hits >= 2) { handleRef.current(val); hits = 0; last = ""; }
              }
            } catch (e) { /* try the next frame */ }
            working = false;
          }
          timer = setTimeout(tick, 150);
        };
        tick();
      } catch (e) { /* no live camera here: photo capture is used instead */ }
    })();
    return () => {
      stopped = true;
      clearTimeout(timer);
      clearTimeout(fbTimer.current);
      if (stream) stream.getTracks().forEach((t) => t.stop());
    };
  }, []);

  const onPhoto = async (e) => {
    const f = e.target.files?.[0];
    e.target.value = "";
    if (!f) return;
    setBusy("Reading barcode...");
    try {
      const photo = await fileToJpeg(f, 2000, 0.92);
      const r = await decodeBarcodePhoto(photo);
      if (r) handle(r.value);
      else setFb({ kind: "bad", text: "Couldn't read a barcode in that photo. Get closer and avoid glare." });
    } catch (err) {
      setFb({ kind: "bad", text: `Couldn't open that photo (${err?.message || "unknown error"}).` });
    }
    setBusy("");
  };

  const fbBg = fb?.kind === "ok" ? "linear-gradient(180deg,#4BEBA5,#1FB878)" : fb?.kind === "warn" ? "linear-gradient(180deg,#FFD667,#F5B52E)" : "linear-gradient(180deg,#FF7A86,#E63E50)";
  const fbFg = fb?.kind === "ok" ? "#03150B" : fb?.kind === "warn" ? "#2A1D00" : "#fff";

  return (
    <div className="fixed inset-0 z-50 flex justify-center overflow-y-auto" style={{ background: "#070A14" }}>
      <div className="backdrop" style={{ opacity: 0.7 }} />
      <div className="w-full max-w-md flex flex-col pb-8 relative" style={{ color: "#fff", zIndex: 1 }}>
        <div className="flex items-center justify-between px-5 pt-5 pb-3">
          <div>
            <div className="disp" style={{ fontSize: 24, fontWeight: 700 }}>{title}</div>
            {progress && <div className="mut" style={{ fontSize: 13, marginTop: 2 }}>{progress}</div>}
          </div>
          <button className="btn" onClick={onClose}>Done</button>
        </div>

        <div className="relative mx-5 overflow-hidden" style={{ aspectRatio: "4 / 3", background: "rgba(0,0,0,.55)", borderRadius: 30, border: "1px solid rgba(255,255,255,.18)", boxShadow: "inset 0 1px 0 rgba(255,255,255,.3)" }}>
          <video ref={videoRef} muted playsInline className="absolute inset-0 w-full h-full" style={{ objectFit: "cover", display: cam ? "block" : "none" }} />
          {!cam && (
            <div className="absolute inset-0 flex flex-col items-center justify-center text-center px-10 gap-3 mut">
              <ScanLine size={56} strokeWidth={1.5} />
              <p style={{ fontSize: 14, lineHeight: 1.45 }}>Live camera isn't available in this view. Take a close photo of the barcode instead.</p>
            </div>
          )}
          <div style={{ position: "absolute", left: "9%", right: "9%", top: "30%", bottom: "30%", border: "3px solid rgba(255,255,255,.92)", borderRadius: 18 }} />
          <span className="sweep" />
          {fb && (
            <div role="status" className="absolute left-4 right-4 bottom-4 px-4 py-3 font-bold" style={{ background: fbBg, color: fbFg, borderRadius: 18, fontSize: 15, boxShadow: "0 8px 24px rgba(0,0,0,.4), inset 0 1px 0 rgba(255,255,255,.5)" }}>
              {fb.text}
            </div>
          )}
        </div>

        {hint && <p className="px-5 mt-4 mut" style={{ fontSize: 14, lineHeight: 1.45 }}>{hint}</p>}

        {sims.length > 0 && (
          <div className="px-5 mt-4">
            <div className="mut" style={{ fontSize: 13, fontWeight: 600, marginBottom: 8 }}>Simulate a scan</div>
            <div className="flex flex-col gap-2">
              {sims.map((s) => (
                <button key={s.tag} onClick={() => handle(s.tag)} className="glass flex items-center gap-3 text-left" style={{ borderRadius: 18, padding: "10px 14px" }}>
                  <span className="disp" style={{ fontSize: 15, fontWeight: 600, minWidth: 100, color: "#8FF5FF" }}>{fmtTag(s.tag)}</span>
                  <span style={{ fontSize: 14 }} className="truncate">{s.text}</span>
                </button>
              ))}
            </div>
          </div>
        )}

        <div className="px-5 mt-5">
          <label className="btn w-full" style={{ cursor: busy ? "wait" : "pointer", opacity: busy ? 0.75 : 1 }}>
            <Camera size={18} /> {busy || "Take a photo of the barcode instead"}
            <input type="file" accept="image/*" capture="environment" onChange={onPhoto} disabled={!!busy} style={{ display: "none" }} />
          </label>
        </div>

        <div className="px-5 mt-5">
          <div className="flex items-center gap-2 mut" style={{ fontSize: 13, fontWeight: 600, marginBottom: 8 }}>
            <Keyboard size={15} /> Tag damaged or unreadable? Type the number
          </div>
          <div className="flex gap-2">
            <input inputMode="numeric" className="field" placeholder="e.g. 0125442817" value={manual} onChange={(e) => setManual(e.target.value.replace(/\D/g, ""))}
              onKeyDown={(e) => { if (e.key === "Enter" && manual) { handle(manual); setManual(""); } }} />
            <button className="btn btn-primary" onClick={() => { if (manual) { handle(manual); setManual(""); } }}>Enter</button>
          </div>
        </div>
      </div>
    </div>
  );
}

function LabelCapture({ onDone, onClose }) {
  const [step, setStep] = useState("barcode"); // barcode | number | manual | confirm
  const [busy, setBusy] = useState("");
  const [msg, setMsg] = useState("");
  const [result, setResult] = useState(null); // { number, kind, source }
  const [manual, setManual] = useState("");
  const [cam, setCam] = useState(false);
  const videoRef = useRef(null);

  // Live barcode scanning where the camera is available in this view.
  useEffect(() => {
    if (step !== "barcode") return;
    let stream, timer, stopped = false, working = false, last = "", hits = 0;
    (async () => {
      try {
        if (!navigator.mediaDevices?.getUserMedia) return;
        stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment", width: { ideal: 1280 } } });
        if (stopped) { stream.getTracks().forEach((t) => t.stop()); return; }
        const v = videoRef.current;
        v.srcObject = stream;
        await v.play();
        setCam(true);
        const native = await nativeItf();
        const canvas = document.createElement("canvas");
        const tick = async () => {
          if (stopped) return;
          if (!working && v.videoWidth) {
            working = true;
            try {
              const sc = Math.min(1, 1000 / v.videoWidth);
              canvas.width = Math.round(v.videoWidth * sc);
              canvas.height = Math.round(v.videoHeight * sc);
              canvas.getContext("2d", { willReadFrequently: true }).drawImage(v, 0, 0, canvas.width, canvas.height);
              let val = null;
              if (native) {
                const out = await native.detect(canvas);
                const hit = out.find((b) => /^\d{10}$/.test(String(b.rawValue).trim()));
                if (hit) val = String(hit.rawValue).trim();
              }
              if (!val) {
                const g = grayFromCanvas(canvas);
                const r = await decodeITF(g.data, g.w, g.h, { quick: true });
                if (r) val = r.value;
              }
              if (val) {
                hits = val === last ? hits + 1 : 1;
                last = val;
                if (hits >= 2 && !stopped) {
                  stopped = true;
                  setResult({ number: val, kind: "barcode", source: "Read from the barcode." });
                  setStep("confirm");
                  return;
                }
              }
            } catch (e) { /* try the next frame */ }
            working = false;
          }
          timer = setTimeout(tick, 150);
        };
        tick();
      } catch (e) { /* no live camera here: photo capture is used instead */ }
    })();
    return () => {
      stopped = true;
      clearTimeout(timer);
      if (stream) stream.getTracks().forEach((t) => t.stop());
      setCam(false);
    };
  }, [step]);

  const onBarcodePhoto = async (e) => {
    const f = e.target.files?.[0];
    e.target.value = "";
    if (!f) return;
    setBusy("Reading barcode...");
    setMsg("");
    try {
      const photo = await fileToJpeg(f, 2000, 0.92);
      const r = await decodeBarcodePhoto(photo);
      if (r) {
        setResult({ number: r.value, kind: "barcode", source: "Read from the barcode." });
        setStep("confirm");
      } else {
        setMsg("Couldn't read the barcode from that photo. Move closer so the barcode fills most of the frame, keep the tag flat, and avoid glare. You can also photograph the number instead.");
      }
    } catch (err) {
      setMsg(`Couldn't open that photo (${err?.message || "unknown error"}). Try again.`);
    }
    setBusy("");
  };

  const onNumberPhoto = async (e) => {
    const f = e.target.files?.[0];
    e.target.value = "";
    if (!f) return;
    setBusy("Reading number...");
    setMsg("");
    try {
      const photo = await fileToJpeg(f, 1280, 0.8);
      const digits = await readNumber(photo);
      if (digits) {
        setResult({ number: digits, kind: "text", source: "Read from the number on the label." });
        setStep("confirm");
      } else {
        setMsg("Couldn't find the number in that photo. Type it in below.");
        setStep("manual");
      }
    } catch (err) {
      setMsg(`Couldn't read the number automatically (${err?.message || "unknown error"}). Type it in below.`);
      setStep("manual");
    }
    setBusy("");
  };

  const title = { barcode: "Scan luggage barcode", number: "Photograph the number", manual: "Type the number", confirm: "Check the number" }[step];
  const goto = (s) => { setMsg(""); setStep(s); };
  const digits = (result?.number || "").replace(/\D/g, "");
  const warns = [];
  if (result) {
    if (result.kind === "text") warns.push("Read from the label text, so check every digit against the tag.");
    if (digits.length !== 10) warns.push("Bag tag numbers are normally 10 digits. Check the digits against the tag.");
  }

  const photoBtn = (label, handler) => (
    <label className="btn btn-primary w-full" style={{ cursor: busy ? "wait" : "pointer", opacity: busy ? 0.75 : 1 }}>
      <Camera size={20} /> {busy || label}
      <input type="file" accept="image/*" capture="environment" onChange={handler} disabled={!!busy} style={{ display: "none" }} />
    </label>
  );

  return (
    <div className="fixed inset-0 z-50 flex justify-center overflow-y-auto" style={{ background: "#070A14" }}>
      <div className="backdrop" style={{ opacity: 0.7 }} />
      <div className="w-full max-w-md flex flex-col pb-8 relative" style={{ color: "#fff", zIndex: 1 }}>
        <div className="flex items-center justify-between px-5 pt-5 pb-3">
          <div className="disp" style={{ fontSize: 24, fontWeight: 700 }}>{title}</div>
          <button className="btn" onClick={onClose}>Close</button>
        </div>

        {step === "barcode" && (
          <>
            <div className="relative mx-5 overflow-hidden" style={{ aspectRatio: "4 / 3", background: "rgba(0,0,0,.55)", borderRadius: 30, border: "1px solid rgba(255,255,255,.18)", boxShadow: "inset 0 1px 0 rgba(255,255,255,.3)" }}>
              <video ref={videoRef} muted playsInline className="absolute inset-0 w-full h-full" style={{ objectFit: "cover", display: cam ? "block" : "none" }} />
              {!cam && (
                <div className="absolute inset-0 flex flex-col items-center justify-center text-center px-10 gap-3 mut">
                  <ScanLine size={56} strokeWidth={1.5} />
                  <p style={{ fontSize: 14, lineHeight: 1.45 }}>Live camera isn't available in this view. Take a close photo of the barcode instead.</p>
                </div>
              )}
              <div style={{ position: "absolute", left: "9%", right: "9%", top: "30%", bottom: "30%", border: "3px solid rgba(255,255,255,.92)", borderRadius: 18 }} />
              <span className="sweep" />
            </div>
            <p className="px-5 mt-4 mut" style={{ fontSize: 14, lineHeight: 1.45 }}>
              {cam ? "Hold the tag flat with the barcode inside the frame. It scans by itself." : "Get close so the barcode fills most of the frame. Any angle works, but keep it sharp and free of glare."}
            </p>
          </>
        )}

        {step === "number" && (
          <p className="px-5 mt-1 mut" style={{ fontSize: 14, lineHeight: 1.5 }}>
            Frame the largest, boldest line of numbers on the tag. That's the unique code. Dates, airport codes, names and booking references are ignored.
          </p>
        )}

        {step === "manual" && (
          <div className="px-5">
            <label className="lbl" style={{ marginTop: 4 }} htmlFor="mn">Luggage number</label>
            <input id="mn" autoFocus inputMode="numeric" className="field disp" style={{ fontSize: 24, fontWeight: 700 }} placeholder="e.g. 0125442817" value={manual}
              onChange={(e) => setManual(e.target.value.replace(/\D/g, "").slice(0, 12))} />
          </div>
        )}

        {step === "confirm" && result && (
          <div className="px-5 mt-1">
            <div className={`glass ${warns.length ? "" : "glass-ok"}`} style={{ borderRadius: 26, padding: 18 }}>
              <div className="mut" style={{ fontSize: 13, fontWeight: 600 }}>Luggage number</div>
              <input aria-label="Luggage number" inputMode="numeric" className="field disp" style={{ marginTop: 8, fontSize: 30, fontWeight: 700, textAlign: "center" }}
                value={result.number} onChange={(e) => setResult((r) => ({ ...r, number: e.target.value.replace(/\D/g, "").slice(0, 12) }))} />
              <div className="mut" style={{ fontSize: 13.5, marginTop: 10 }}>{result.source}</div>
              {warns.length > 0 && (
                <ul style={{ listStyle: "none", padding: 0, margin: "10px 0 0", fontSize: 13.5, lineHeight: 1.45 }}>
                  {warns.map((w, i) => (
                    <li key={i} className="flex gap-2" style={{ padding: "3px 0", color: "#FFE3A0" }}><AlertTriangle size={15} style={{ flex: "none", marginTop: 2 }} />{w}</li>
                  ))}
                </ul>
              )}
            </div>
          </div>
        )}

        {msg && <div role="alert" className="glass glass-bad mx-5 mt-4" style={{ borderRadius: 18, padding: "11px 14px", fontSize: 14, lineHeight: 1.45 }}>{msg}</div>}

        <div className="px-5 mt-5 flex flex-col gap-3">
          {step === "barcode" && (
            <>
              {photoBtn("Take a photo of the barcode", onBarcodePhoto)}
              <button className="btn w-full" onClick={() => goto("number")} disabled={!!busy}>Can't scan it? Photograph the number</button>
              <button className="btn w-full" onClick={() => goto("manual")} disabled={!!busy}><Keyboard size={18} /> Type it in</button>
            </>
          )}
          {step === "number" && (
            <>
              {photoBtn("Take a photo of the number", onNumberPhoto)}
              <button className="btn w-full" onClick={() => goto("barcode")} disabled={!!busy}>Back to barcode scan</button>
              <button className="btn w-full" onClick={() => goto("manual")} disabled={!!busy}><Keyboard size={18} /> Type it in</button>
            </>
          )}
          {step === "manual" && (
            <>
              <button className="btn btn-primary w-full" disabled={manual.length < 6} onClick={() => onDone(manual)}><Check size={18} /> Use this number</button>
              <button className="btn w-full" onClick={() => goto("barcode")}>Back to barcode scan</button>
            </>
          )}
          {step === "confirm" && (
            <>
              <button className="btn btn-primary w-full" disabled={digits.length < 6} onClick={() => onDone(digits)}><Check size={18} /> Use this number</button>
              <button className="btn w-full" onClick={() => { setResult(null); goto("barcode"); }}>Scan again</button>
            </>
          )}
        </div>
      </div>
    </div>
  );
}

function CaseForm({ initial, dest, cases, freeCodes, customTypes, onAddType, customColors, onAddColor, onSave, onClose }) {
  const editing = !!initial;
  const [code, setCode] = useState(initial?.code || "");
  const [name, setName] = useState(initial?.name || "");
  const [type, setType] = useState(initial?.type || "Peli 1510");
  const [contents, setContents] = useState(initial?.contents || "");
  const [tagHistory, setTagHistory] = useState(initial?.tagHistory || []);
  const currentTag = tagHistory.length ? tagHistory[tagHistory.length - 1].number : "";
  const [carnet, setCarnet] = useState(initial?.carnet || "");
  const [photos, setPhotos] = useState(initial?.photos || []);
  const [scanning, setScanning] = useState(false);
  const [capturing, setCapturing] = useState(false);
  const [color, setColor] = useState(initial?.color || "Black");
  const [alsoMine, setAlsoMine] = useState(false);
  const [addingType, setAddingType] = useState(false);
  const [newType, setNewType] = useState("");

  const commitType = () => {
    const t = newType.trim();
    if (!t) return;
    const all = [...BASE_TYPES, ...customTypes];
    const existing = all.find((x) => x.toLowerCase() === t.toLowerCase());
    if (existing) setType(existing);
    else { onAddType(t); setType(t); }
    setAddingType(false);
    setNewType("");
  };

  const [addingColor, setAddingColor] = useState(false);
  const [newColor, setNewColor] = useState("");
  const commitColor = () => {
    const c = newColor.trim();
    if (!c) return;
    const all = [...Object.keys(BASE_COLORS), ...customColors];
    const existing = all.find((x) => x.toLowerCase() === c.toLowerCase());
    if (existing) setColor(existing);
    else { onAddColor(c); setColor(c); }
    setAddingColor(false);
    setNewColor("");
  };

  const importFile = (e) => {
    const f = e.target.files?.[0];
    if (!f) return;
    const r = new FileReader();
    r.onload = () => {
      const rows = String(r.result).split(/\r?\n/).map((l) => l.split(",")[0].replace(/^"|"$/g, "").trim()).filter(Boolean);
      setContents((c) => (c ? c.trim() + "\n" : "") + rows.join("\n"));
    };
    r.readAsText(f);
    e.target.value = "";
  };

  const addPhoto = async (e) => {
    const f = e.target.files?.[0];
    e.target.value = "";
    if (!f) return;
    try { const p = await fileToJpeg(f); setPhotos((ps) => [...ps, p]); } catch (err) { /* ignore unreadable image */ }
  };

  const onStickerScan = (c) => {
    const existing = cases[c];
    if (existing) return { kind: "bad", text: `${c} is already on "${existing.name}"` };
    setCode(c);
    return { kind: "ok", text: `${c} linked to this case` };
  };

  const simCodes = freeCodes.slice(0, 4).map((c) => ({ code: c, text: "Unused sticker from your pack" }));
  const canSave = code && name.trim();

  return (
    <>
      <Sheet title={editing ? "Edit case" : dest?.kind === "kit" ? "Add to My Kit" : dest?.kind === "folder" ? "Add to folder" : "Add luggage"} onClose={onClose}>
        {!editing && <div className="mut" style={{ fontSize: 13, marginTop: 6 }}>Adding to {dest?.kind === "trip" || dest?.kind === "folder" ? dest.name : "My Kit"}</div>}
        <label className="lbl">Sticker</label>
        {code ? (
          <div className="flex items-center gap-3">
            <Plate code={code} status="ok" size="lg" />
            {!editing && <button className="btn" onClick={() => setScanning(true)}>Scan again</button>}
          </div>
        ) : (
          <button className="btn btn-primary w-full" onClick={() => setScanning(true)}>
            <ScanLine size={20} /> Scan sticker on case
          </button>
        )}

        <label className="lbl" htmlFor="cname">Case name</label>
        <input id="cname" className="field" placeholder="e.g. Phantom VEO" value={name} onChange={(e) => setName(e.target.value)} />

        <label className="lbl" htmlFor="ctype">Case type</label>
        {!addingType ? (
          <div className="flex gap-2">
            <select id="ctype" className="field" value={type} onChange={(e) => setType(e.target.value)}>
              {TYPE_GROUPS.map((g) => (
                <optgroup key={g.label} label={g.label}>{g.items.map((t) => <option key={t} value={t}>{t}</option>)}</optgroup>
              ))}
              {customTypes.length > 0 && (
                <optgroup label="My types">{customTypes.map((t) => <option key={t} value={t}>{t}</option>)}</optgroup>
              )}
              {![...BASE_TYPES, ...customTypes].includes(type) && <option value={type}>{type}</option>}
            </select>
            <button className="btn" style={{ flex: "none" }} onClick={() => setAddingType(true)}><Plus size={18} /> New</button>
          </div>
        ) : (
          <div className="flex gap-2">
            <input className="field" autoFocus aria-label="New case type" placeholder="e.g. Pelicase 1490" value={newType} onChange={(e) => setNewType(e.target.value)}
              onKeyDown={(e) => e.key === "Enter" && commitType()} />
            <button className="btn btn-primary" style={{ flex: "none" }} disabled={!newType.trim()} onClick={commitType}>Add</button>
            <button className="btn" style={{ flex: "none" }} aria-label="Cancel new type" onClick={() => { setAddingType(false); setNewType(""); }}><X size={18} /></button>
          </div>
        )}

        <label className="lbl" htmlFor="ccolor">Case / bag colour</label>
        {!addingColor ? (
          <div className="flex items-center gap-3">
            <Swatch name={color} size={30} />
            <select id="ccolor" className="field" value={color} onChange={(e) => setColor(e.target.value)}>
              {Object.keys(BASE_COLORS).map((c) => <option key={c} value={c}>{c}</option>)}
              {customColors.length > 0 && <optgroup label="My colours">{customColors.map((c) => <option key={c} value={c}>{c}</option>)}</optgroup>}
            </select>
            <button className="btn" style={{ flex: "none" }} onClick={() => setAddingColor(true)}><Plus size={18} /> New</button>
          </div>
        ) : (
          <div className="flex gap-2">
            <input className="field" autoFocus aria-label="New colour name" placeholder="e.g. Hi-vis" value={newColor} onChange={(e) => setNewColor(e.target.value)}
              onKeyDown={(e) => e.key === "Enter" && commitColor()} />
            <button className="btn btn-primary" style={{ flex: "none" }} disabled={!newColor.trim()} onClick={commitColor}>Add</button>
            <button className="btn" style={{ flex: "none" }} aria-label="Cancel new colour" onClick={() => { setAddingColor(false); setNewColor(""); }}><X size={18} /></button>
          </div>
        )}

        <label className="lbl" htmlFor="cc">Contents</label>
        <textarea id="cc" className="field" rows={6} placeholder={"One item per line\nCamera body\nBattery x2"} value={contents} onChange={(e) => setContents(e.target.value)} />
        <label className="btn mt-3 w-full" style={{ cursor: "pointer" }}>
          <Upload size={18} /> Import from spreadsheet or notes
          <input type="file" accept=".csv,.txt,text/csv,text/plain" onChange={importFile} style={{ display: "none" }} />
        </label>
        <div className="mut" style={{ fontSize: 12.5, marginTop: 8 }}>Accepts .csv or .txt. For a spreadsheet, the first column becomes the item name.</div>

        <label className="lbl">Bag tag</label>
        {currentTag ? (
          <div className="glass flex items-center gap-3" style={{ borderRadius: 18, padding: "12px 14px" }}>
            <div className="disp" style={{ fontSize: 19, fontWeight: 700, flex: 1 }}>{fmtTag(currentTag)}</div>
            <button className="btn" style={{ flex: "none" }} onClick={() => setCapturing(true)}>Replace</button>
            <button className="iconbtn" style={{ width: 36, height: 36 }} aria-label="Clear bag tag" onClick={() => setTagHistory((h) => [...h, { number: "", at: now(), checkpoint: null }])}><X size={16} /></button>
          </div>
        ) : (
          <button className="btn w-full" onClick={() => setCapturing(true)}>
            <ScanLine size={18} /> Scan bag tag barcode
          </button>
        )}
        <div className="mut" style={{ fontSize: 12.5, marginTop: 8, lineHeight: 1.45 }}>
          A fresh tag is issued each time the case is checked in, so save the new number whenever that happens. If that doesn't work you can photograph the number, or type it in.
        </div>
        {tagHistory.filter((h) => h.number).length > 0 && (
          <details className="mt-3">
            <summary className="mut" style={{ fontSize: 13, fontWeight: 600, cursor: "pointer" }}>Tag history ({tagHistory.filter((h) => h.number).length})</summary>
            <ul style={{ listStyle: "none", padding: 0, margin: "8px 0 0" }}>
              {[...tagHistory].reverse().filter((h) => h.number).map((h, i) => (
                <li key={i} className="flex justify-between gap-2" style={{ padding: "6px 0", borderBottom: "1px solid rgba(255,255,255,.1)", fontSize: 13.5 }}>
                  <span className="disp" style={{ fontWeight: 600 }}>{fmtTag(h.number)}</span>
                  <span className="mut">{h.at}</span>
                </li>
              ))}
            </ul>
          </details>
        )}

        <label className="lbl" htmlFor="ccarnet">Carnet information</label>
        <input id="ccarnet" className="field" placeholder="Carnet number and item reference" value={carnet} onChange={(e) => setCarnet(e.target.value)} />

        <label className="lbl">Case photos</label>
        <div className="flex gap-3 flex-wrap">
          {photos.map((p, i) => (
            <div key={i} className="relative" style={{ width: 88, height: 88, borderRadius: 18, overflow: "hidden", border: "1px solid rgba(255,255,255,.25)" }}>
              <img src={p} alt={`Case photo ${i + 1}`} style={{ width: "100%", height: "100%", objectFit: "cover" }} />
              <button aria-label="Remove photo" onClick={() => setPhotos((ps) => ps.filter((_, j) => j !== i))}
                style={{ position: "absolute", top: 4, right: 4, background: "rgba(0,0,0,.6)", border: "none", borderRadius: "50%", width: 24, height: 24, display: "flex", alignItems: "center", justifyContent: "center" }}><X size={14} /></button>
            </div>
          ))}
          <label className="glass flex flex-col items-center justify-center gap-1" style={{ width: 88, height: 88, borderRadius: 18, cursor: "pointer", fontSize: 12, fontWeight: 600 }}>
            <Camera size={22} /> Add photo
            <input type="file" accept="image/*" capture="environment" onChange={addPhoto} style={{ display: "none" }} />
          </label>
        </div>
        <div className="mut" style={{ fontSize: 12.5, marginTop: 8 }}>Optional. Helps you recognise the case later.</div>

        {dest?.kind === "trip" && !editing && (
          <button className="glass flex items-center gap-3 w-full text-left mt-5" aria-pressed={alsoMine} onClick={() => setAlsoMine((v) => !v)} style={{ borderRadius: 18, padding: "12px 14px" }}>
            <span aria-hidden="true" style={{ width: 26, height: 26, borderRadius: 8, flex: "none", border: "1px solid rgba(255,255,255,.45)", background: alsoMine ? "linear-gradient(180deg,#fff,#D4E2FF)" : "rgba(255,255,255,.06)", color: "#0A0F1E", display: "flex", alignItems: "center", justifyContent: "center" }}>{alsoMine && <Check size={17} />}</span>
            <span style={{ fontSize: 14, lineHeight: 1.4 }}><b>Also keep in My Kit</b><br /><span className="mut">Turn on for cases you own. Leave off for hired kit.</span></span>
          </button>
        )}

        <button className="btn btn-primary w-full mt-7" disabled={!canSave}
          onClick={() => onSave({ code, name: name.trim(), type, color, contents: contents.trim(), tagHistory, carnet: carnet.trim(), photos }, alsoMine)}>
          <Check size={20} /> {editing ? "Save changes" : "Save case"}
        </button>
        {!canSave && <div className="mut" style={{ fontSize: 13, marginTop: 10, textAlign: "center" }}>{!code ? "Scan a sticker to link this case." : "Give the case a name to save it."}</div>}
      </Sheet>
      {scanning && (
        <Scanner title="Scan sticker" hint="Point at the QR sticker on the case. Its code is saved to this case." onScan={onStickerScan} onClose={() => setScanning(false)} sims={simCodes} closeOnOk />
      )}
      {capturing && <LabelCapture onClose={() => setCapturing(false)} onDone={(n) => { setTagHistory((h) => [...h, { number: n, at: now(), checkpoint: null }]); setCapturing(false); }} />}
    </>
  );
}

const STORE_KEY = "checkmate-state-v1";

// This standalone build saves to the browser's own localStorage, which is private to this
// device and this exact page address, and survives closing the tab or the browser.
async function loadSaved() {
  try {
    const raw = window.localStorage.getItem(STORE_KEY);
    return raw ? JSON.parse(raw) : null;
  } catch (e) {
    return null; // first run, nothing saved yet, or storage blocked (e.g. private browsing)
  }
}

async function saveState(state) {
  try {
    window.localStorage.setItem(STORE_KEY, JSON.stringify(state));
    return true;
  } catch (e) {
    return false; // saved again automatically on the next change
  }
}

/* ------------------------------------------------------------------ */
/*  Main app                                                           */
/* ------------------------------------------------------------------ */
function Checkmate() {
  const [cases, setCases] = useState(() => Object.fromEntries(SEED_CASES.map((c) => [c.code, c])));
  const [trips, setTrips] = useState(SEED_TRIPS);
  const [tab, setTab] = useState("trips");
  const [seg, setSeg] = useState("current");
  const [tripId, setTripId] = useState(null);
  const [sheet, setSheet] = useState(null);
  const [toast, setToast] = useState(null);
  const [q, setQ] = useState("");
  const [newName, setNewName] = useState("");
  const [customTypes, setCustomTypes] = useState([]);
  const [customColors, setCustomColors] = useState([]);
  const [openF, setOpenF] = useState({ mine: true });
  const [folders, setFolders] = useState(SEED_FOLDERS);
  const [folderName, setFolderName] = useState("");
  const [loaded, setLoaded] = useState(false);
  const [saveState_, setSaveState_] = useState("idle"); // idle | saving | saved | error
  const toastT = useRef();
  const saveT = useRef();

  // Load whatever was saved last time. Runs once, before anything is written back out.
  useEffect(() => {
    let live = true;
    (async () => {
      const saved = await loadSaved();
      if (!live) return;
      if (saved) {
        if (saved.cases) setCases(saved.cases);
        if (saved.trips) setTrips(saved.trips);
        if (saved.folders) setFolders(saved.folders);
        if (saved.customTypes) setCustomTypes(saved.customTypes);
        if (saved.customColors) setCustomColors(saved.customColors);
      }
      setLoaded(true);
    })();
    return () => { live = false; };
  }, []);

  // Save on every change, once loading has finished, so a fresh load never overwrites itself with the seed data.
  useEffect(() => {
    if (!loaded) return;
    setSaveState_("saving");
    clearTimeout(saveT.current);
    saveT.current = setTimeout(async () => {
      const ok = await saveState({ cases, trips, folders, customTypes, customColors });
      setSaveState_(ok === false ? "error" : "saved");
    }, 400);
    return () => clearTimeout(saveT.current);
  }, [cases, trips, folders, customTypes, customColors, loaded]);

  const say = (t) => {
    setToast(t);
    clearTimeout(toastT.current);
    toastT.current = setTimeout(() => setToast(null), 2400);
  };
  useEffect(() => () => clearTimeout(toastT.current), []);

  const trip = trips.find((t) => t.id === tripId);
  const updateTrip = (id, fn) => setTrips((ts) => ts.map((t) => (t.id === id ? fn(t) : t)));
  const freeCodes = ALL_CODES.filter((c) => !cases[c]);
  const mineCodes = folders.find((f) => f.id === "mine").codes;
  const isMine = (code) => mineCodes.includes(code);
  const missingOf = (t) => t.caseCodes.filter((c) => !t.scanned.includes(c));
  const statusOf = (t, c) => (t.scanned.includes(c) ? "ok" : t.flagged ? "missing" : "pending");

  /* ---- actions ---- */
  const createTrip = () => {
    const t = { id: uid(), name: newName.trim() || "Untitled trip", status: "current", caseCodes: [], checkpoints: [], mode: "edit", scanned: [], flagged: false };
    setTrips((ts) => [t, ...ts]);
    setNewName("");
    setSheet(null);
    setTripId(t.id);
    setSeg("current");
  };

  const addType = (t) => setCustomTypes((ts) => (ts.includes(t) ? ts : [...ts, t]));
  const addColor = (c) => setCustomColors((cs) => (cs.includes(c) ? cs : [...cs, c]));

  // dest: { kind: "kit" } | { kind: "folder", id, name } | { kind: "trip", id, name } | { kind: "edit" }
  const addToFolder = (fid, code) =>
    setFolders((fs) => fs.map((f) => (f.id === fid && !f.codes.includes(code) ? { ...f, codes: [...f.codes, code] } : f)));

  const submitCase = (c, dest, alsoMine) => {
    setCases((cs) => ({ ...cs, [c.code]: c }));
    if (dest.kind === "kit") addToFolder("mine", c.code);
    if (dest.kind === "folder") addToFolder(dest.id, c.code);
    if (dest.kind === "trip") {
      updateTrip(dest.id, (t) => (t.caseCodes.includes(c.code) ? t : { ...t, caseCodes: [...t.caseCodes, c.code] }));
      if (alsoMine) addToFolder("mine", c.code);
    }
    setSheet(null);
    say(dest.kind === "kit" ? `${c.name} saved to My Kit` : dest.kind === "folder" ? `${c.name} saved to ${dest.name}` : dest.kind === "trip" ? `${c.name} added to ${dest.name}${alsoMine ? " and My Kit" : ""}` : `${c.name} updated`);
  };

  const toggleFolderMember = (code, fid) =>
    setFolders((fs) => fs.map((f) => (f.id !== fid ? f : f.codes.includes(code) ? { ...f, codes: f.codes.filter((x) => x !== code) } : { ...f, codes: [...f.codes, code] })));

  const createFolder = () => {
    const name = folderName.trim();
    if (!name) return;
    const id = uid();
    setFolders((fs) => [...fs, { id, name, codes: [] }]);
    setOpenF((o) => ({ ...o, [id]: true }));
    setFolderName("");
    setSheet(null);
    say(`Folder "${name}" created`);
  };
  const renameFolder = (id) => {
    const name = folderName.trim();
    if (!name) return;
    setFolders((fs) => fs.map((f) => (f.id === id ? { ...f, name } : f)));
    setSheet(null);
    say("Folder renamed");
  };
  const deleteFolder = (id) => {
    setFolders((fs) => fs.filter((f) => f.id !== id));
    setSheet(null);
    say("Folder deleted. The cases are still in your kit.");
  };

  // Reusing kit that isn't in My Kit: the sticker must be scanned again, because kit houses often supply a different physical case.
  const reuseScan = (tmpl, code, tid) => {
    const t = trips.find((x) => x.id === tid);
    if (code === tmpl.code) {
      if (t.caseCodes.includes(code)) return { kind: "warn", text: `${tmpl.name} is already on this trip` };
      updateTrip(tid, (x) => ({ ...x, caseCodes: [...x.caseCodes, code] }));
      return { kind: "ok", text: "Same case as last time. Added to the trip." };
    }
    const existing = cases[code];
    if (existing) return { kind: "bad", text: `${code} is already on "${existing.name}". Scan the sticker on the case you're packing.` };
    setCases((cs) => ({ ...cs, [code]: { ...tmpl, code, tagHistory: [], photos: [] } }));
    updateTrip(tid, (x) => ({ ...x, caseCodes: [...x.caseCodes, code] }));
    return { kind: "ok", text: `New case ${code} linked. Contents copied from last time.` };
  };

  // Cases in My Kit go straight onto the trip, after a chance to confirm what's actually inside them today.
  // Anything from a folder or a past trip that isn't in My Kit needs its QR code rescanned, since it could be a different physical case.
  const splitCodes = (codes) => ({ direct: codes.filter(isMine), rescan: codes.filter((c) => !isMine(c)).map((c) => cases[c]) });

  const updateContents = (code, contents) => setCases((cs) => ({ ...cs, [code]: { ...cs[code], contents } }));

  const addCodesToTrip = (tid, codes) => {
    const t = trips.find((x) => x.id === tid);
    const { direct, rescan } = splitCodes(codes.filter((c) => !t.caseCodes.includes(c)));
    setTripId(tid);
    if (direct.length) setSheet({ kind: "confirmContents", queue: direct, tripId: tid, then: rescan.length ? { rescan } : null });
    else if (rescan.length) setSheet({ kind: "reuse", queue: rescan, tripId: tid });
    else setSheet(null);
  };

  const createTripFrom = (codes, name) => {
    const { direct, rescan } = splitCodes(codes);
    const t = { id: uid(), name: name.trim() || "Untitled trip", status: "current", caseCodes: [], checkpoints: [], mode: "edit", scanned: [], flagged: false };
    setTrips((ts) => [t, ...ts]);
    setNewName("");
    setSeg("current");
    setTripId(t.id);
    if (direct.length) setSheet({ kind: "confirmContents", queue: direct, tripId: t.id, then: rescan.length ? { rescan } : null });
    else if (rescan.length) setSheet({ kind: "reuse", queue: rescan, tripId: t.id });
    else { setSheet(null); say(`${t.name} created`); }
  };

  // After confirming (or skipping confirmation for) a batch of My Kit cases, add them and roll into any queued rescans.
  const finishConfirm = (tid, addCodes, thenState) => {
    const t = trips.find((x) => x.id === tid);
    if (addCodes.length) updateTrip(tid, (x) => ({ ...x, caseCodes: [...x.caseCodes, ...addCodes.filter((c) => !x.caseCodes.includes(c))] }));
    if (thenState?.rescan?.length) setSheet({ kind: "reuse", queue: thenState.rescan, tripId: tid });
    else { setSheet(null); say(`${addCodes.length} added to ${t.name}`); }
  };

  const removeFromTrip = (code) =>
    updateTrip(tripId, (t) => ({ ...t, caseCodes: t.caseCodes.filter((c) => c !== code), scanned: t.scanned.filter((c) => c !== code) }));

  const scanInTrip = (code) => {
    const t = trips.find((x) => x.id === tripId);
    const c = cases[code];
    if (!t.caseCodes.includes(code))
      return { kind: "bad", text: c ? `${code} "${c.name}" isn't on this trip` : `${code} isn't linked to any case yet` };
    if (t.scanned.includes(code)) return { kind: "warn", text: `${c.name} was already scanned` };
    updateTrip(t.id, (x) => ({ ...x, scanned: [...x.scanned, code] }));
    const left = t.caseCodes.length - t.scanned.length - 1;
    return { kind: "ok", text: `${c.name} scanned. ${left === 0 ? "That's every case." : `${left} to go.`}` };
  };

  // Checking a case off by its current bag tag rather than its QR sticker, for cases that don't have a sticker yet.
  const scanTagInTrip = (digits) => {
    const t = trips.find((x) => x.id === tripId);
    const holder = t.caseCodes.find((code) => tagOf(cases[code])?.number === digits);
    if (!holder) {
      const elsewhere = Object.values(cases).find((c) => tagOf(c)?.number === digits);
      return { kind: "bad", text: elsewhere ? `That tag belongs to "${elsewhere.name}", which isn't on this trip` : "No case on this trip has that tag number. Check it's been saved to the right case." };
    }
    if (t.scanned.includes(holder)) return { kind: "warn", text: `${cases[holder].name} was already scanned` };
    updateTrip(t.id, (x) => ({ ...x, scanned: [...x.scanned, holder] }));
    const left = t.caseCodes.length - t.scanned.length - 1;
    return { kind: "ok", text: `${cases[holder].name} scanned. ${left === 0 ? "That's every case." : `${left} to go.`}` };
  };

  const openCheckpoint = () => {
    if (missingOf(trip).length) updateTrip(trip.id, (x) => ({ ...x, flagged: true }));
    setSheet({ kind: "checkpoint", mode: "log" });
  };
  const openComplete = () => {
    if (missingOf(trip).length) updateTrip(trip.id, (x) => ({ ...x, flagged: true }));
    setSheet({ kind: "checkpoint", mode: "complete" });
  };

  const confirmCheckpoint = (mode, name) => {
    const t = trip;
    const missing = missingOf(t);
    const cp = { id: uid(), name: name.trim() || `Checkpoint ${t.checkpoints.length + 1}`, at: now(), total: t.caseCodes.length, scanned: [...t.scanned], missing };
    updateTrip(t.id, (x) => ({ ...x, checkpoints: [...x.checkpoints, cp], scanned: [], flagged: false, ...(mode === "complete" ? { status: "past", mode: "edit" } : {}) }));
    setSheet(null);
    if (mode === "complete") {
      setTripId(null);
      setSeg("past");
      say(`${t.name} completed. Its kit is now a folder in Kit.`);
    } else say(`${cp.name} logged. List cleared for the next checkpoint.`);
  };

  // A case gets a new bag tag whenever it's checked in again, independent of whether this moment is also a checkpoint.
  const recordTag = (code, number) =>
    setCases((cs) => ({ ...cs, [code]: { ...cs[code], tagHistory: [...(cs[code].tagHistory || []), { number, at: now(), checkpoint: null }] } }));

  const duplicateTrip = (t) => {
    const n = { id: uid(), name: `${t.name} (copy)`, status: "current", caseCodes: [...t.caseCodes], checkpoints: [], mode: "edit", scanned: [], flagged: false };
    setTrips((ts) => [n, ...ts]);
    setSeg("current");
    setTripId(n.id);
    say("Copied as a new trip");
  };

  const tripsWith = (code) => trips.filter((t) => t.caseCodes.includes(code)).map((t) => t.name);

  /* ---- sheets ---- */
  const renderSheet = () => {
    if (!sheet) return null;

    if (sheet.kind === "newTrip")
      return (
        <Sheet title="New trip" onClose={() => setSheet(null)}>
          <label className="lbl" htmlFor="tn">Trip name</label>
          <input id="tn" autoFocus className="field" placeholder="e.g. Wildstar - California" value={newName} onChange={(e) => setNewName(e.target.value)}
            onKeyDown={(e) => e.key === "Enter" && createTrip()} />
          <button className="btn btn-primary w-full mt-6" onClick={createTrip}><Plus size={20} /> Create trip</button>
        </Sheet>
      );

    if (sheet.kind === "addChoice")
      return (
        <Sheet title="Add luggage" onClose={() => setSheet(null)}>
          <button className="btn btn-primary w-full mt-5" onClick={() => setSheet({ kind: "caseForm", dest: { kind: "trip", id: trip.id, name: trip.name } })}>
            <ScanLine size={20} /> New case: scan a sticker
          </button>
          <button className="btn w-full mt-3" onClick={() => setSheet({ kind: "pick" })}>
            <Boxes size={20} /> Choose from My Kit or previous trips
          </button>
        </Sheet>
      );

    if (sheet.kind === "pick") return <PickSheet trip={trip} trips={trips} cases={cases} folders={folders} onClose={() => setSheet(null)}
      onAdd={(codes) => addCodesToTrip(trip.id, codes)} />;

    if (sheet.kind === "reuse") return <ReuseSheet queue={sheet.queue} tripId={sheet.tripId} freeCodes={freeCodes} onScan={reuseScan}
      onClose={(summary) => { setSheet(null); if (summary) say(summary); }} />;

    if (sheet.kind === "confirmContents") return <ConfirmContentsSheet queue={sheet.queue.map((c) => cases[c]).filter(Boolean)} tripId={sheet.tripId}
      onSaveContents={updateContents} onDone={(codes) => finishConfirm(sheet.tripId, codes, sheet.then)} onClose={() => setSheet(null)} />;

    if (sheet.kind === "destination")
      return (
        <Sheet title="Where should this case go?" onClose={() => setSheet(null)}>
          <button className="btn btn-primary w-full mt-5" onClick={() => setSheet({ kind: "caseForm", dest: { kind: "kit" } })}>
            <Boxes size={20} /> My Kit
          </button>
          {folders.filter((f) => f.id !== "mine").map((f) => (
            <button key={f.id} className="btn w-full mt-3" onClick={() => setSheet({ kind: "caseForm", dest: { kind: "folder", id: f.id, name: f.name } })}>
              <FolderIcon size={20} /> <span className="truncate">{f.name}</span>
            </button>
          ))}
          {trips.filter((t) => t.status === "current").map((t) => (
            <button key={t.id} className="btn w-full mt-3" onClick={() => setSheet({ kind: "caseForm", dest: { kind: "trip", id: t.id, name: t.name } })}>
              <ClipboardList size={20} /> <span className="truncate">{t.name}</span>
            </button>
          ))}
          <div className="mut" style={{ fontSize: 13, marginTop: 14, lineHeight: 1.45 }}>Pick My Kit or a folder for cases you want to keep. Pick a trip for hired kit that only belongs to that shoot.</div>
        </Sheet>
      );

    if (sheet.kind === "newFolder")
      return (
        <Sheet title="New folder" onClose={() => setSheet(null)}>
          <label className="lbl" htmlFor="fn">Folder name</label>
          <input id="fn" autoFocus className="field" placeholder="e.g. Wildstar Kit" value={folderName} onChange={(e) => setFolderName(e.target.value)} onKeyDown={(e) => e.key === "Enter" && createFolder()} />
          <p className="mut" style={{ fontSize: 13, marginTop: 10, lineHeight: 1.45 }}>Drag cases in from any other folder. They're linked, not copied, so a case can sit in several folders at once.</p>
          <button className="btn btn-primary w-full mt-5" disabled={!folderName.trim()} onClick={createFolder}><FolderPlus size={20} /> Create folder</button>
        </Sheet>
      );

    if (sheet.kind === "folderMenu") {
      const f = folders.find((x) => x.id === sheet.id);
      if (!f) return null;
      return (
        <Sheet title="Folder options" onClose={() => setSheet(null)}>
          {f.id === "mine" ? (
            <p className="mut" style={{ fontSize: 14, marginTop: 14, lineHeight: 1.5 }}>My Kit is built in, so it can't be renamed or deleted. Cases in it go straight onto trips without a rescan.</p>
          ) : (
            <>
              <label className="lbl" htmlFor="rn">Folder name</label>
              <input id="rn" className="field" value={folderName} onChange={(e) => setFolderName(e.target.value)} onKeyDown={(e) => e.key === "Enter" && renameFolder(f.id)} />
              <button className="btn btn-primary w-full mt-4" disabled={!folderName.trim()} onClick={() => renameFolder(f.id)}><Check size={18} /> Save name</button>
              <button className="btn btn-danger w-full mt-3" onClick={() => deleteFolder(f.id)}><Trash2 size={18} /> Delete folder</button>
              <p className="mut" style={{ fontSize: 13, marginTop: 12, lineHeight: 1.45 }}>Deleting a folder only removes the folder. The cases stay in your kit and in any other folders or past trips.</p>
            </>
          )}
        </Sheet>
      );
    }

    if (sheet.kind === "assignTrip") {
      const current = trips.filter((t) => t.status === "current");
      const n = sheet.codes.length;
      return (
        <Sheet title="Add to trip" onClose={() => setSheet(null)}>
          <p className="mut" style={{ fontSize: 14, marginTop: 6 }}>{n} {n === 1 ? "case" : "cases"} selected</p>
          {current.map((t) => (
            <button key={t.id} className="btn w-full mt-3" onClick={() => addCodesToTrip(t.id, sheet.codes)}>
              <ClipboardList size={20} /> <span className="truncate">{t.name}</span>
            </button>
          ))}
          {current.length === 0 && <div className="mut" style={{ padding: "12px 0" }}>No current trips. Create a new trip with these cases instead.</div>}
        </Sheet>
      );
    }

    if (sheet.kind === "newTripFrom") {
      const n = sheet.codes.length;
      return (
        <Sheet title="New trip from selection" onClose={() => setSheet(null)}>
          <p className="mut" style={{ fontSize: 14, marginTop: 6 }}>{n} {n === 1 ? "case" : "cases"} will be added</p>
          <label className="lbl" htmlFor="tnf">Trip name</label>
          <input id="tnf" autoFocus className="field" placeholder="e.g. Wildstar - California" value={newName} onChange={(e) => setNewName(e.target.value)}
            onKeyDown={(e) => e.key === "Enter" && createTripFrom(sheet.codes, newName)} />
          <button className="btn btn-primary w-full mt-5" onClick={() => createTripFrom(sheet.codes, newName)}><Plus size={20} /> Create trip</button>
        </Sheet>
      );
    }

    if (sheet.kind === "caseForm")
      return <CaseForm initial={sheet.initial} dest={sheet.dest} cases={cases} freeCodes={freeCodes} customTypes={customTypes} onAddType={addType}
        customColors={customColors} onAddColor={addColor} onClose={() => setSheet(null)} onSave={(c, also) => submitCase(c, sheet.dest, also)} />;

    if (sheet.kind === "detail") {
      const c = cases[sheet.code];
      const inCheck = trip && trip.mode === "check" && trip.caseCodes.includes(c.code) && !trip.scanned.includes(c.code);
      return (
        <Sheet title={c.name} onClose={() => setSheet(null)}>
          <div className="flex items-center gap-3 mt-4 flex-wrap">
            <Plate code={c.code} status="idle" size="lg" />
            <span className="mut flex items-center gap-2" style={{ fontSize: 15, fontWeight: 600 }}><Swatch name={c.color} size={14} />{c.type}, {c.color}</span>
          </div>
          {c.photos.length > 0 && (
            <div className="flex gap-3 mt-4 overflow-x-auto">
              {c.photos.map((p, i) => <img key={i} src={p} alt={`${c.name} ${i + 1}`} style={{ height: 130, borderRadius: 18, border: "1px solid rgba(255,255,255,.25)" }} />)}
            </div>
          )}
          <dl style={{ fontSize: 15 }}>
            <dt className="lbl">Luggage label</dt>
            <dd style={{ fontWeight: 600 }} className="disp">{tagOf(c)?.number ? fmtTag(tagOf(c).number) : <span className="mut" style={{ fontWeight: 400, fontFamily: "Manrope" }}>None added</span>}</dd>
            <dt className="lbl">Carnet</dt>
            <dd>{c.carnet || <span className="mut">None added</span>}</dd>
            <dt className="lbl">Contents ({lines(c.contents).length})</dt>
            <dd>
              {lines(c.contents).length === 0 && <span className="mut">Nothing listed yet</span>}
              <ul style={{ listStyle: "none", padding: 0, margin: 0 }}>
                {lines(c.contents).map((l, i) => (
                  <li key={i} style={{ padding: "9px 0", borderBottom: "1px solid rgba(255,255,255,.1)" }}>{l}</li>
                ))}
              </ul>
            </dd>
          </dl>
          <div className="lbl">Folders</div>
          <div className="flex gap-2 flex-wrap">
            {folders.map((f) => (
              <button key={f.id} className="chip" aria-pressed={f.codes.includes(c.code)} onClick={() => toggleFolderMember(c.code, f.id)}>
                {f.codes.includes(c.code) && <Check size={14} />}{f.name}
              </button>
            ))}
          </div>
          <div className="mut" style={{ fontSize: 12.5, marginTop: 8, lineHeight: 1.45 }}>Folders hold links to this case, not copies. Turning one off never deletes the case.</div>
          {tripsWith(c.code).length > 0 && <div className="mut" style={{ fontSize: 13, marginTop: 14 }}>On trips: {tripsWith(c.code).join(", ")}</div>}
          {!isMine(c.code) && <div className="mut" style={{ fontSize: 13, marginTop: 8, lineHeight: 1.45 }}>This isn't in My Kit, so it could be a different physical case next time. Rescan the QR code when you reuse it.</div>}
          {inCheck && (
            <button className="btn w-full mt-6" onClick={() => { updateTrip(trip.id, (x) => ({ ...x, scanned: [...x.scanned, c.code] })); setSheet(null); say(`${c.name} marked as found`); }}>
              <Check size={18} /> Mark as found without scanning
            </button>
          )}
          <button className="btn w-full mt-3" onClick={() => setSheet({ kind: "caseForm", initial: c, dest: { kind: "edit" } })}><Pencil size={18} /> Edit case</button>
        </Sheet>
      );
    }

    if (sheet.kind === "checkpoint") return <CheckpointSheet trip={trip} cases={cases} mode={sheet.mode} onClose={() => setSheet(null)} onConfirm={confirmCheckpoint} />;

    if (sheet.kind === "changeTag") return <LabelCapture onClose={() => setSheet(null)} onDone={(n) => { recordTag(sheet.code, n); setSheet(null); say(`New tag saved for ${cases[sheet.code].name}`); }} />;

    if (sheet.kind === "scan") {
      const unscanned = trip.caseCodes.filter((c) => !trip.scanned.includes(c));
      const stranger = Object.keys(cases).find((c) => !trip.caseCodes.includes(c));
      const sims = unscanned.map((c) => ({ code: c, text: cases[c].name }));
      if (stranger) sims.push({ code: stranger, text: `${cases[stranger].name} (not on this trip)` });
      return (
        <Scanner title="Scan cases" progress={`${trip.scanned.length} of ${trip.caseCodes.length} scanned`}
          hint="Scan any face of a case. Each one lights up green as it's found." onScan={scanInTrip} onClose={() => setSheet(null)} sims={sims} />
      );
    }

    if (sheet.kind === "scanTag") {
      const unscanned = trip.caseCodes.filter((c) => !trip.scanned.includes(c) && tagOf(cases[c])?.number);
      const tagSims = unscanned.map((c) => ({ tag: tagOf(cases[c]).number, text: cases[c].name }));
      const noTagYet = trip.caseCodes.filter((c) => !trip.scanned.includes(c) && !tagOf(cases[c])?.number).map((c) => cases[c].name);
      return (
        <TagScanner title="Scan bag tags" progress={`${trip.scanned.length} of ${trip.caseCodes.length} scanned`}
          hint={noTagYet.length ? `Scanning by bag tag. ${noTagYet.length} case${noTagYet.length === 1 ? " has" : "s have"} no tag saved yet, so tap it in the list and add one first: ${noTagYet.join(", ")}.` : "Scan the barcode on each bag tag. Each case lights up green as it's found."}
          onScan={scanTagInTrip} onClose={() => setSheet(null)} sims={tagSims} />
      );
    }
    return null;
  };

  /* ---- screens ---- */
  const tripSubtitle = (t) => {
    const n = t.caseCodes.length;
    if (t.status === "past") return `${n} cases, ${t.checkpoints.length} ${t.checkpoints.length === 1 ? "checkpoint" : "checkpoints"} logged`;
    if (t.mode === "check") return `${t.scanned.length} of ${n} scanned${t.checkpoints.length ? `, checkpoint ${t.checkpoints.length + 1}` : ""}`;
    return `${n} ${n === 1 ? "case" : "cases"}, not started`;
  };

  const TripsList = () => {
    const list = trips.filter((t) => t.status === seg);
    return (
      <div className="px-4 pt-3">
        <div className="segwrap glass">
          <button className="seg" aria-pressed={seg === "current"} onClick={() => setSeg("current")}>Current trips</button>
          <button className="seg" aria-pressed={seg === "past"} onClick={() => setSeg("past")}>Past trips</button>
        </div>
        {seg === "current" && (
          <button className="btn btn-primary w-full mt-4" onClick={() => setSheet({ kind: "newTrip" })}><Plus size={20} /> New trip</button>
        )}
        <div className="flex flex-col gap-3 mt-4">
          {list.map((t) => (
            <button key={t.id} className="trip glass" onClick={() => setTripId(t.id)}>
              <div style={{ flex: 1, minWidth: 0 }}>
                <div className="disp truncate" style={{ fontSize: 20, fontWeight: 600, lineHeight: 1.15 }}>{t.name}</div>
                <div className="mut" style={{ fontSize: 13, marginTop: 5 }}>{tripSubtitle(t)}</div>
              </div>
              <ChevronRight size={20} className="mut" />
            </button>
          ))}
          {list.length === 0 && (
            <div className="mut" style={{ padding: "32px 8px", textAlign: "center" }}>
              {seg === "current" ? "No current trips. Tap New trip to build a checklist." : "Completed trips will show up here."}
            </div>
          )}
        </div>
      </div>
    );
  };

  const TripScreen = () => {
    const t = trip;
    const isPast = t.status === "past";
    const total = t.caseCodes.length;
    const done = t.scanned.length;
    const allDone = total > 0 && done === total;
    const missing = missingOf(t);

    const cpList = t.checkpoints.length > 0 && (
      <div className="mt-7">
        <div className="disp" style={{ fontSize: 18, fontWeight: 600, marginBottom: 10 }}>Checkpoints logged</div>
        <div className="flex flex-col gap-2">
          {t.checkpoints.map((l) => (
            <div key={l.id} className={`glass ${l.missing.length ? "glass-bad" : "glass-ok"}`} style={{ borderRadius: 20, padding: "12px 14px" }}>
              <div className="flex justify-between gap-2"><span style={{ fontWeight: 700 }}>{l.name}</span><span className="mut" style={{ fontSize: 13 }}>{l.at}</span></div>
              <div style={{ fontSize: 13.5, marginTop: 4, fontWeight: 600, color: l.missing.length ? "#FFB3BA" : "#8CF3C0" }}>
                {l.missing.length ? `${l.scanned.length} of ${l.total} scanned. Missing: ${l.missing.map((c) => cases[c]?.name || c).join(", ")}` : `All ${l.total} cases scanned`}
              </div>
            </div>
          ))}
        </div>
      </div>
    );

    return (
      <div className="flex flex-col min-h-screen">
        <TopBar title={t.name} sub={tripSubtitle(t)} onBack={() => setTripId(null)} />
        {!isPast && (
          <div className="px-4 pt-3">
            <div className="segwrap glass">
              <button className="seg" aria-pressed={t.mode === "edit"} onClick={() => updateTrip(t.id, (x) => ({ ...x, mode: "edit" }))}>Editor</button>
              <button className="seg" aria-pressed={t.mode === "check"} disabled={total === 0} onClick={() => updateTrip(t.id, (x) => ({ ...x, mode: "check" }))}>Checklist</button>
            </div>
          </div>
        )}

        <div className="flex-1 px-4 pt-4" style={{ paddingBottom: 130 }}>
          {/* ---------- Editor ---------- */}
          {!isPast && t.mode === "edit" && (
            <>
              <label className="lbl" style={{ marginTop: 0 }} htmlFor="trn">Trip name</label>
              <input id="trn" className="field" value={t.name} onChange={(e) => updateTrip(t.id, (x) => ({ ...x, name: e.target.value }))} />
              <div className="disp" style={{ fontSize: 18, fontWeight: 600, margin: "22px 0 10px" }}>Luggage ({total})</div>
              <div className="flex flex-col gap-3">
                {t.caseCodes.map((c) => (
                  <CaseRow key={c} c={cases[c]} onClick={() => setSheet({ kind: "detail", code: c })}
                    right={<button className="iconbtn" style={{ width: 36, height: 36 }} aria-label={`Remove ${cases[c].name}`} onClick={() => removeFromTrip(c)}><Trash2 size={16} /></button>} />
                ))}
                {total === 0 && <div className="mut" style={{ padding: "12px 4px" }}>No luggage yet. Add each case that's travelling, then start the trip.</div>}
              </div>
              <button className="btn w-full mt-4" onClick={() => setSheet({ kind: "addChoice" })}><Plus size={20} /> Add luggage</button>
              {cpList}
            </>
          )}

          {/* ---------- Checklist ---------- */}
          {!isPast && t.mode === "check" && (
            <>
              <div className={`glass flex items-center gap-4 ${allDone ? "glass-ok" : t.flagged ? "glass-bad" : ""}`} style={{ borderRadius: 28, padding: 16 }}>
                <Ring done={done} total={total} flagged={t.flagged} />
                <div style={{ minWidth: 0 }}>
                  <div className="disp" style={{ fontSize: 20, fontWeight: 700, lineHeight: 1.2 }}>
                    {allDone ? "Every case accounted for" : t.flagged ? `${missing.length} missing` : "Scan each case"}
                  </div>
                  <div className="mut" style={{ fontSize: 13.5, marginTop: 6, lineHeight: 1.4 }}>
